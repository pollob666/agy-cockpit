        if (appShellEl) appShellEl.classList.add('has-diag-bar');
        if (diagStickyEl.getAttribute('data-render-key') === renderKey) {
          return;
        }
        diagStickyEl.setAttribute('data-render-key', renderKey);

        const firstIssue = issues[0];
        const shortLabel =
          (diag.agyUpdated ? 'AGY Update: ' : 'AGY API Issue: ') +
          issues.length +
          (issues.length === 1 ? ' contract (' + firstIssue.id + ')' : ' contracts');

        let drawerHtml = '';
        if (state.diagExpanded) {
          let cardsHtml = '';
          for (const item of issues) {
            const bClass = item.status === 'fail' ? 'fail' : 'warn';
            cardsHtml +=
              '<div class="diag-issue-card">' +
                '<div class="diag-issue-top">' +
                  '<div style="display:flex;align-items:center;gap:6px;">' +
                    '<span class="diag-badge ' + bClass + '">' + escapeHtml(item.status) + '</span>' +
                    '<strong style="font-size:12.5px;color:var(--foreground,#ededed);">' + escapeHtml(item.title || item.id) + '</strong>' +
                  '</div>' +
                  '<span class="diag-symbol">' + escapeHtml(item.codeSymbol || '') + '</span>' +
                '</div>' +
                '<div style="color:var(--foreground,#e2e2e2);">' + escapeHtml(item.detail || '') + '</div>' +
                (item.fixHint
                  ? '<div class="muted" style="font-size:11.5px;">Fix: ' + escapeHtml(item.fixHint) + '</div>'
                  : '') +
              '</div>';
          }
          drawerHtml =
            '<div class="diag-drawer' + (isFail ? ' is-fail' : '') + '">' +
              '<div class="diag-drawer-head">' +
                '<span>Antigravity Contract Verifier (' + issues.length + ')</span>' +
                '<div style="display:flex;align-items:center;gap:5px;">' +
                  '<button class="ghost-btn" data-action="diag-recheck"' + (state.diagRechecking ? ' disabled' : '') + '>' +
                    (state.diagRechecking ? 'Checking...' : 'Re-run Doctor') +
                  '</button>' +
                  '<button class="btn-solid" style="padding:3px 9px;font-size:12px;" data-action="diag-copy">Copy Fix Prompt</button>' +
                '</div>' +
              '</div>' +
              cardsHtml +
            '</div>';
        }

        const barHtml =
          '<div class="diag-bar' + (isFail ? ' is-fail' : '') + '">' +
            '<div class="diag-bar-left" data-action="diag-toggle" title="Click to inspect broken or changed AGY contracts">' +
              '<span class="dot-sm ' + (isFail ? 'dot-polluted' : 'dot-heavy') + '"></span>' +
              '<span class="diag-bar-title">' + escapeHtml(shortLabel) + '</span>' +
            '</div>' +
            '<div class="diag-bar-actions">' +
              '<button class="ghost-btn" style="padding:2px 7px;font-size:12px;" data-action="diag-toggle">' +
                (state.diagExpanded ? 'Hide' : 'Details') +
              '</button>' +
              '<button class="ghost-btn" style="padding:2px 7px;font-size:12px;" data-action="diag-copy" title="Copy diagnostic fix prompt for agent">Copy Fix</button>' +
              '<button class="ghost-btn" style="padding:2px 6px;font-size:13px;" data-action="diag-dismiss" title="Dismiss warning for this session">×</button>' +
            '</div>' +
          '</div>';

        diagStickyEl.innerHTML = drawerHtml + barHtml;
      }

      async function handleRecheckDiagnostics() {
        if (state.diagRechecking) return;
        state.diagRechecking = true;
        renderDiagnosticsSticky();
        try {
          const qs = new URLSearchParams({ refresh: '1' });
          if (urlSimulateDiag) qs.set('simulate', urlSimulateDiag);
          const res = await apiFetch('/api/diagnostics?' + qs.toString());
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const report = await res.json();
          const issues = Array.isArray(report.contracts)
            ? report.contracts.filter((c) => c.status !== 'pass')
            : [];
          state.diagnostics = {
            status: report.status || 'ok',
            issueCount: issues.length,
            failCount: report.failCount || 0,
            warnCount: report.warnCount || 0,
            signature: report.signature || 'ok',
            checkedAtMs: report.checkedAtMs || Date.now(),
            agyUpdated: Boolean(report.agyUpdated),
            issues
          };
          if (issues.length === 0) {
            state.diagExpanded = false;
            showToast('All AGY contracts healthy!');
          } else {
            showToast('Doctor found ' + issues.length + ' contract issue(s)');
          }
        } catch (err) {
          showToast('Doctor check failed: ' + err.message);
        } finally {
          state.diagRechecking = false;
          renderDiagnosticsSticky();
        }
      }

      async function handleCopyDiagnosticsFixPrompt() {
        const diag = state.diagnostics;
        const issues = diag && Array.isArray(diag.issues) ? diag.issues : [];
        if (issues.length === 0) return;
        const lines = [
          'Context Health Contract Verifier detected Antigravity (AGY) API/schema drift:',
          ''
        ];
        for (const item of issues) {
          lines.push(`- [${String(item.status || '').toUpperCase()}] ${item.id} (${item.title})`);
          if (item.codeSymbol) lines.push(`  Target: ${item.codeSymbol}`);
          if (item.detail) lines.push(`  Detail: ${item.detail}`);
          if (item.fixHint) lines.push(`  Fix Hint: ${item.fixHint}`);
        }
        lines.push('');
        lines.push('Run `node setup.cjs --doctor` (and `/agy-api-audit` if needed) and fix the affected contracts in d:\\dev\\tools\\antigravity.');
        await copyTextToClipboard(lines.join('\n'));
        showToast('Copied AGY contract fix prompt');
      }

      async function fetchStatus(force = false) {
        if (!force && state.pollInFlight) return;
        state.pollInFlight = true;
        try {
          const currentQuery = state.searchQuery.trim();
          const queryChanged = currentQuery !== state.lastFetchedQuery;
          const params = new URLSearchParams();
          if (!force && !queryChanged && state.version > 0 && !urlSimulateDiag) {
            params.set('sinceVersion', String(state.version));
          }
          if (force) params.set('force', '1');
          if (urlSimulateDiag) params.set('simulateDiag', urlSimulateDiag);
          if (state.hostConvId) params.set('activeConvId', state.hostConvId);
          if (isThisIframeActiveConv() && (state.lastPinnedId || state.hostConvId)) {
            params.set('viewedConvId', state.lastPinnedId || state.hostConvId);
          }
          if (state.workspaceUris.length > 0) {
            params.set('workspaceUris', JSON.stringify(state.workspaceUris));
          }
          if (currentQuery) {
            params.set('q', currentQuery);
          }

          const res = await apiFetch('/api/status?' + params.toString());
          if (!res.ok) return;
          const data = await res.json();
          if (data.uiMtimeMs) {
            if (state.uiMtimeMs > 0 && data.uiMtimeMs !== state.uiMtimeMs) {
              window.location.reload();
              return;
            }
            state.uiMtimeMs = data.uiMtimeMs;
          }
          if (data.unchanged && !force && !queryChanged && !urlSimulateDiag) return;

          state.version = data.version || state.version;
          state.lastFetchedQuery = currentQuery;
          if (data.hostConversationId && !state.hostConvId) {
            state.hostConvId = String(data.hostConversationId).trim().toLowerCase();
          }
          state.activeWorkspaceKey = data.activeWorkspaceKey || '';
          state.workspaces = Array.isArray(data.workspaces) ? data.workspaces : [];
          state.archivedProjects = Array.isArray(data.archivedProjects) ? data.archivedProjects : [];
          state.archivedConversations = Array.isArray(data.archivedConversations) ? data.archivedConversations : [];
          if (Array.isArray(data.availableModels) && data.availableModels.length > 0) {
            state.availableModels = data.availableModels;
          }
          if (data.defaultModelEnum) {
            state.defaultModelEnum = data.defaultModelEnum;
          }
          if (data.diagnostics) {
            state.diagnostics = data.diagnostics;
          }
          state.conversations = Array.isArray(data.conversations) ? data.conversations : [];
          state.searchMatches = data.searchMatches || null;

          renderAll();
          await checkPendingSmartHandoff();
        } catch (err) {
          console.error('[ContextHealth] status poll failed:', err);
        } finally {
          state.pollInFlight = false;
          state.lastPollDoneMs = Date.now();
        }
      }

      async function ensureModelsLoaded(convId, forceRefresh = false) {
        try {
          const qs = new URLSearchParams();
          if (convId) qs.set('convId', convId);
          if (forceRefresh) qs.set('refresh', '1');
          const res = await apiFetch('/api/models?' + qs.toString());
          if (!res.ok) return;
          const data = await res.json();
          if (Array.isArray(data.models) && data.models.length > 0) {
            state.availableModels = data.models;
          }
          if (data.defaultModelEnum) {
            state.defaultModelEnum = data.defaultModelEnum;
          }
          if (convId && data.convModelEnum) {
            const card = state.conversations.find((c) => c.id === convId);
            if (card) {
              card.modelEnum = data.convModelEnum;
              if (data.convModelLabel) {
                card.modelLabel = data.convModelLabel;
              }
            }
          }
          renderAll();
        } catch {}
      }

      async function refreshOpenDetailsDrawers() {
        const openIds = Array.from(state.expandedDetails.keys());
        if (openIds.length === 0) return;
        await Promise.all(openIds.map(async (convId) => {
          try {
            const res = await apiFetch('/api/conversation-details?id=' + encodeURIComponent(convId));
            if (!res.ok) return;
            const data = await res.json();
            state.detailsRevCounter += 1;
            data._rev = state.detailsRevCounter;
            state.expandedDetails.set(convId, data);
          } catch {}
        }));
        renderAll();
      }

      async function toggleDetails(convId) {
        if (state.expandedDetails.has(convId)) {
          state.expandedDetails.delete(convId);
          renderAll();
          return;
        }
        state.detailsRevCounter += 1;
        state.expandedDetails.set(convId, { loading: true, _rev: state.detailsRevCounter });
        renderAll();
        try {
          const res = await apiFetch('/api/conversation-details?id=' + encodeURIComponent(convId));
          if (!res.ok) throw new Error('Failed to load details');
          const data = await res.json();
          state.detailsRevCounter += 1;
          data._rev = state.detailsRevCounter;
          state.expandedDetails.set(convId, data);
        } catch {
          state.expandedDetails.delete(convId);
          showToast('Failed to load conversation details');
        }
        renderAll();
      }

      function readCurrentHandoffText(convId) {
        const activeTa = document.querySelector('textarea.handoff-input[data-focus-conv="' + convId + '"]');
        const hState = getHandoffState(convId);
        if (activeTa) {
          hState.text = activeTa.value;
        }
        return hState.text || '';
      }

      async function fetchHandoffData(convId, focusText) {
        const focus = (focusText || '').trim();
        const qs = new URLSearchParams({ id: convId });
        if (focus) qs.set('focus', focus);
        const res = await apiFetch('/api/handoff-summary?' + qs.toString());
        if (!res.ok) throw new Error('Failed to build handoff request');
        const data = await res.json();
        return { data, focus };
      }

      function cancelPendingSmartHandoff() {
        state.pendingSmartHandoff = null;
        renderAll();
      }

      async function checkPendingSmartHandoff() {
        const pending = state.pendingSmartHandoff;
        if (!pending || pending.completing) return;

        if (Date.now() - pending.requestedAtMs > 180000) {
          cancelPendingSmartHandoff();
          showToast('Smart handoff timed out waiting for agent response');
          return;
        }

        const conv = state.conversations.find((c) => c.id === pending.convId);
        if (!conv) return;

        const hasNewHandoff =
          Boolean(conv.latestHandoffPrompt) &&
          (conv.latestHandoffMs > pending.baselineHandoffMs ||
            conv.latestHandoffPrompt !== pending.baselinePromptText);

        if (!hasNewHandoff) return;

        pending.completing = true;
        const convId = pending.convId;
        const finalPrompt = conv.latestHandoffPrompt;
        const hState = getHandoffState(convId);
        hState.text = finalPrompt;
        hState.step = 'ready';
        state.openHandoffId = convId;
        state.scrollPositions.set(convId + ':handoff', 0);

        cancelPendingSmartHandoff();
        const activeTa = document.querySelector('textarea.handoff-input[data-focus-conv="' + convId + '"]');
        if (activeTa) {
          activeTa.focus();
        }
        showToast('AI handoff prompt ready for review');
      }

      async function handleSmartHandoffRun(convId) {
        const card = state.conversations.find((c) => c.id === convId);
        const focus = readCurrentHandoffText(convId).trim();
        state.openHandoffId = convId;

        try {
          const { data } = await fetchHandoffData(convId, focus);

          if (window.sidecar && window.sidecar.agent && typeof window.sidecar.agent.sendMessage === 'function') {
            state.pendingSmartHandoff = {
              convId,
              baselineHandoffMs: Math.max((card && card.latestHandoffMs) || 0, data.latestHandoffMs || 0),
              baselinePromptText: data.latestHandoffPrompt || (card && card.latestHandoffPrompt) || '',
              requestedAtMs: Date.now(),
              completing: false
            };
            renderAll();

            try {
              const res = await window.sidecar.agent.sendMessage(data.promptForAgentHandoff, convId);
              if (res && res.error) {
                throw new Error(res.error);
              }
              showToast('Agent is drafting smart handoff...');
              return;
            } catch (agentErr) {
              cancelPendingSmartHandoff();
              console.warn('[ContextHealth] agent sendMessage failed:', agentErr);
              showToast('Agent unavailable: ' + agentErr.message);
              return;
            }
          }

          await copyTextToClipboard(data.promptForAgentHandoff || '');
          showToast('Copied handoff request to clipboard');
        } catch (err) {
          cancelPendingSmartHandoff();
          showToast('Error starting smart handoff: ' + err.message);
        }
      }

      async function handleStartNewChatFromHandoff(convId) {
        const promptText = readCurrentHandoffText(convId).trim();
        if (!promptText) {
          showToast('Handoff prompt is empty');
          return;
        }

        const card = state.conversations.find((c) => c.id === convId);
        const selectedModel = resolveSelectedModelEntry(card);
        try {
          await postAndActivateNewConversation(
            {
              message: promptText,
              conversationId: convId,
              projectId: (card && card.projectId) || '',
              workspacePath: (card && card.workspacePath) || '',
              model: (selectedModel && selectedModel.modelEnum) || (card && card.modelEnum) || '',
              modelId: (selectedModel && selectedModel.modelId) || ''
            },
            () => {
              state.openHandoffId = null;
              state.handoffStateByConv.delete(convId);
            }
          );
          showToast('Started new conversation with handoff!');
          return;
        } catch (chatErr) {
          console.warn('[ContextHealth] startConversation failed, falling back to clipboard:', chatErr);
          await copyTextToClipboard(promptText);
          showToast('Could not start chat automatically; copied prompt to clipboard');
          return;
        }
      }

      async function postAndActivateNewConversation(reqBody, onBeforeActivate) {
        const httpRes = await apiFetch('/_sidecar/new-conversation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reqBody)
        });
        const res = await httpRes.json().catch(() => ({}));
        if (!httpRes.ok || (res && res.error)) {
          throw new Error((res && res.error) || 'Failed to start conversation');
        }
        const rawUuidMatch =
          res && typeof res.raw === 'string'
            ? /([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i.exec(res.raw)
            : null;
        const newConvId = (
          (res && (res.conversationId || res.conversation_id)) ||
          (res && res.response && (res.response.conversationId || res.response.conversation_id)) ||
          (rawUuidMatch ? rawUuidMatch[1] : '') ||
          ''
        ).trim().toLowerCase();

        if (typeof onBeforeActivate === 'function') {
          onBeforeActivate(newConvId);
        }

        if (newConvId) {
          state.selectedWorkspaceKey = '__auto__';
          if (!initialHostConvId) {
            state.hostConvId = newConvId;
            state.manualPinId = newConvId;
            state.manualPinTs = Date.now();
          }
          claimActiveConversation(newConvId);
          openConversationInHost(newConvId);
        } else if (!initialHostConvId) {
          state.manualPinId = '';
          state.manualPinTs = 0;
        }
        await fetchStatus(true);
        setTimeout(() => { if (!isIframeHidden()) fetchStatus(true); }, 800);
        setTimeout(() => { if (!isIframeHidden()) fetchStatus(true); }, 2200);
        return newConvId;
      }

      async function handleStartQuickNewChat() {
        const ta = document.getElementById('new-chat-textarea');
        if (ta) {
          state.newChatText = ta.value;
        }
        const promptText = (state.newChatText || '').trim();
        if (!promptText) {
          showToast('Write a message to start a conversation');
          if (ta) ta.focus();
          return;
        }
        if (state.newChatSending) return;
        state.newChatSending = true;

        const pinnedCard = state.conversations.find((c) => c.id === state.lastPinnedId) || null;
        const effectiveScope = resolveEffectiveWorkspaceScope(pinnedCard);
        const targetWs = resolveNewChatTargetWorkspace(effectiveScope, pinnedCard);
        const hasProjectTarget = Boolean(targetWs && (targetWs.projectId || targetWs.path));
        const isGeneral = !hasProjectTarget || Boolean(state.newChatGeneral);

        const preferredModelEnum =
          (pinnedCard && pinnedCard.modelEnum) ||
          state.defaultModelEnum ||
          (state.availableModels[0] && state.availableModels[0].modelEnum) ||
          '';

        renderNewChatDrawer(effectiveScope, pinnedCard);

        try {
          await postAndActivateNewConversation(
            {
              message: promptText,
              general: isGeneral,
              conversationId: (pinnedCard && pinnedCard.id) || state.hostConvId || '',
              projectId: isGeneral ? '' : ((targetWs && targetWs.projectId) || ''),
              workspacePath: isGeneral ? '' : ((targetWs && targetWs.path) || ''),
              model: preferredModelEnum
            },
            () => {
              state.newChatSending = false;
              state.newChatOpen = false;
              state.newChatText = '';
            }
          );
          showToast(isGeneral ? 'Started new general conversation!' : 'Started new conversation!');
        } catch (err) {
          state.newChatSending = false;
          renderAll();
          showToast('Error starting conversation: ' + err.message);
        }
      }

      async function handleCopyHandoffText(convId) {
        const promptText = readCurrentHandoffText(convId).trim();
        if (!promptText) {
          showToast('Handoff prompt is empty');
          return;
        }
        await copyTextToClipboard(promptText);
        showToast('Copied handoff prompt');
      }

      function markConversationSeenInServer(convId) {
        if (!convId) return;
        const card = state.conversations.find((c) => c.id === convId);
        if (card) {
          card.unread = false;
        }
        void apiFetch('/api/conversation-seen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: convId })
        }).catch(() => {});
      }

      function pickFallbackConversationAfterRemove(removedConvId) {
        const remaining = state.conversations.filter(
          (c) => !c.isSubagent && c.id !== removedConvId
        );
        if (remaining.length === 0) return null;
        if (state.activeWorkspaceKey) {
          const sameWs = remaining.filter((c) => c.workspaceKey === state.activeWorkspaceKey);
          if (sameWs.length > 0) return sameWs[0];
        }
        return remaining[0];
      }

      async function handleSetConversationArchived(convId, archived) {
        if (!convId) return;
        state.openMenuConvId = null;
        try {
          if (archived && (convId === state.lastPinnedId || convId === state.hostConvId || convId === initialHostConvId)) {
            if (convId === initialHostConvId) {
              initialHostConvId = '';
            }
            const fallback = pickFallbackConversationAfterRemove(convId);
            if (fallback) {
              state.hostConvId = fallback.id;
              state.manualPinId = fallback.id;
              state.manualPinTs = Date.now();
              openConversationInHost(fallback.id);
            } else {
              state.hostConvId = '';
              state.manualPinId = '';
              state.lastPinnedId = '';
            }
          }
          const res = await apiFetch('/api/conversation-archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversationId: convId, archived: Boolean(archived) })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to update conversation');
          }
          await fetchStatus(true);
          const totalArch =
            (Array.isArray(state.archivedProjects) ? state.archivedProjects.length : 0) +
            (Array.isArray(state.archivedConversations) ? state.archivedConversations.length : 0);
          if (!archived && totalArch > 0 && modalBackdropEl.classList.contains('open')) {
            openArchivedModal();
          } else {
            closeModal();
          }
          showToast(archived ? 'Archived conversation' : 'Restored conversation');
        } catch (err) {
          closeModal();
          showToast('Error: ' + err.message);
        }
      }

      function openDeleteConvConfirmModal(convId, convTitle) {
        if (!modalBackdropEl || !convId) return;
        state.openMenuConvId = null;
        renderAll();
        const safeTitle = escapeHtml(convTitle || ('Conversation ' + convId.slice(0, 8)));
        modalBackdropEl.innerHTML =
          '<div class="modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Delete conversation?</div>' +
            '<div class="modal-body">' +
              'Permanently delete <strong>' + safeTitle + '</strong>? This removes the trajectory from Antigravity and cannot be undone.' +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Cancel</button>' +
              '<button class="btn-danger" data-action="confirm-delete-conv" data-id="' + escapeHtml(convId) + '">Delete</button>' +
            '</div>' +
          '</div>';
        modalBackdropEl.classList.add('open');
      }

      async function handleDeleteConversation(convId, fromArchivedModal = false) {
        if (!convId) return;
        state.openMenuConvId = null;
        try {
          if (convId === state.lastPinnedId || convId === state.hostConvId || convId === initialHostConvId) {
            if (convId === initialHostConvId) {
              initialHostConvId = '';
            }
            const fallback = pickFallbackConversationAfterRemove(convId);
            if (fallback) {
              state.hostConvId = fallback.id;
              state.manualPinId = fallback.id;
              state.manualPinTs = Date.now();
              openConversationInHost(fallback.id);
              await new Promise((r) => setTimeout(r, 120));
            } else {
              state.hostConvId = '';
              state.manualPinId = '';
              state.lastPinnedId = '';
            }
          }
          const res = await apiFetch('/api/conversation-delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversationId: convId })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to delete conversation');
          }
          state.expandedDetails.delete(convId);
          state.handoffStateByConv.delete(convId);
          if (state.openHandoffId === convId) state.openHandoffId = null;
          await fetchStatus(true);
          const totalArch =
            (Array.isArray(state.archivedProjects) ? state.archivedProjects.length : 0) +
            (Array.isArray(state.archivedConversations) ? state.archivedConversations.length : 0);
          if (fromArchivedModal && totalArch > 0 && modalBackdropEl.classList.contains('open')) {
            openArchivedModal();
          } else {
            closeModal();
          }
          showToast('Deleted conversation');
        } catch (err) {
          closeModal();
          showToast('Error: ' + err.message);
        }
      }

      function closeModal() {
        if (!modalBackdropEl) return;
        modalBackdropEl.classList.remove('open');
        modalBackdropEl.innerHTML = '';
      }

      function openArchiveConfirmModal(projectId, projectName, wsKey) {
        if (!modalBackdropEl || !projectId) return;
        const safeName = escapeHtml(projectName || 'this project');
        modalBackdropEl.innerHTML =
          '<div class="modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Archive project "' + safeName + '"?</div>' +
            '<div class="modal-body">' +
              'This will temporarily hide <strong>' + safeName + '</strong> and its conversations from both the Antigravity sidebar and Context Health. Nothing is deleted, and you can unarchive it anytime.' +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Cancel</button>' +
              '<button class="btn-primary" data-action="confirm-archive-project" data-project-id="' + escapeHtml(projectId) + '" data-project-name="' + escapeHtml(projectName || '') + '" data-ws-key="' + escapeHtml(wsKey || '') + '">Archive Project</button>' +
            '</div>' +
          '</div>';
        modalBackdropEl.classList.add('open');
      }

      function openArchivedModal() {
        if (!modalBackdropEl) return;
        const projList = Array.isArray(state.archivedProjects) ? state.archivedProjects : [];
        const convList = Array.isArray(state.archivedConversations) ? state.archivedConversations : [];
        if (projList.length === 0 && convList.length === 0) {
          closeModal();
          return;
        }
        let rowsHtml = '';
        for (const c of convList) {
          const title = c.title || c.firstPrompt || c.lastPrompt || ('Conversation ' + c.id.slice(0, 8));
          const sub = [c.workspaceName || 'General', formatRelativeTime(c.lastActiveMs)].filter(Boolean).join(' · ');
          rowsHtml +=
            '<div class="modal-row">' +
              '<div class="modal-row-info">' +
                '<span class="modal-row-name">' + escapeHtml(title) + '</span>' +
                '<span class="modal-row-sub">Chat · ' + escapeHtml(sub) + '</span>' +
              '</div>' +
              '<div style="display:flex;gap:4px;flex-shrink:0;">' +
                '<button class="btn-primary" data-action="confirm-unarchive-conv" data-id="' + escapeHtml(c.id) + '">Restore</button>' +
                '<button class="btn-danger" data-action="confirm-delete-conv" data-from-archived="1" data-id="' + escapeHtml(c.id) + '" title="Delete permanently">Delete</button>' +
              '</div>' +
            '</div>';
        }
        for (const p of projList) {
          const chatLabel = p.count === 1 ? '1 chat' : (p.count + ' chats');
          rowsHtml +=
            '<div class="modal-row">' +
              '<div class="modal-row-info">' +
                '<span class="modal-row-name">' + escapeHtml(p.name) + '</span>' +
                '<span class="modal-row-sub">Project · ' + escapeHtml(chatLabel + (p.path ? ' · ' + p.path : '')) + '</span>' +
              '</div>' +
              '<button class="btn-primary" data-action="confirm-unarchive-project" data-project-id="' + escapeHtml(p.id) + '" data-project-name="' + escapeHtml(p.name) + '">Unarchive</button>' +
            '</div>';
        }
        modalBackdropEl.innerHTML =
          '<div class="modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Archived (' + (projList.length + convList.length) + ')</div>' +
            '<div class="modal-body">Restore or manage archived conversations and projects:</div>' +
            '<div class="modal-list">' + rowsHtml + '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Close</button>' +
            '</div>' +
          '</div>';
        modalBackdropEl.classList.add('open');
      }

      async function handleSetProjectArchived(projectId, projectName, archived, wsKey) {
        if (!projectId) return;
        try {
          const res = await apiFetch('/api/project-archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectId, archived: Boolean(archived) })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to update project');
          }
          if (archived && wsKey && state.selectedWorkspaceKey === wsKey) {
            state.selectedWorkspaceKey = '__auto__';
          }
          await fetchStatus(true);
          const totalArch =
            (Array.isArray(state.archivedProjects) ? state.archivedProjects.length : 0) +
            (Array.isArray(state.archivedConversations) ? state.archivedConversations.length : 0);
          if (!archived && totalArch > 0 && modalBackdropEl.classList.contains('open')) {
            openArchivedModal();
          } else {
            closeModal();
          }
          showToast((archived ? 'Archived ' : 'Unarchived ') + (projectName || 'project'));
        } catch (err) {
          closeModal();
          showToast('Error: ' + err.message);
        }
      }

      document.addEventListener('contextmenu', (e) => {
        const wsBtn = e.target.closest('[data-ws][data-project-id]');
        if (wsBtn) {
          e.preventDefault();
          const projId = wsBtn.getAttribute('data-project-id');
          const projName = wsBtn.getAttribute('data-project-name') || '';
          const wsKey = wsBtn.getAttribute('data-ws') || '';
          openArchiveConfirmModal(projId, projName, wsKey);
          return;
        }
        const archBtn = e.target.closest('[data-action="open-archived-modal"]');
        if (archBtn) {
          e.preventDefault();
          openArchivedModal();
        }
      });

      document.addEventListener('click', async (e) => {
        if (modalBackdropEl && e.target === modalBackdropEl) {
          closeModal();
          return;
        }

        if (state.openMenuConvId && !e.target.closest('.card-menu-wrap')) {
          state.openMenuConvId = null;
          renderAll();
        }

        const wsBtn = e.target.closest('[data-ws]');
        if (wsBtn) {
          const nextWs = wsBtn.getAttribute('data-ws');
          state.selectedWorkspaceKey = nextWs;
          if (state.newChatOpen) {
            if (nextWs === '__unscoped__') {
              state.newChatGeneral = true;
            } else if (nextWs && nextWs !== '__all__') {
              state.newChatGeneral = false;
            }
          }
          renderAll();
          return;
        }

        const actionBtn = e.target.closest('[data-action]');
        if (!actionBtn) return;
        const action = actionBtn.getAttribute('data-action');
        const convId = actionBtn.getAttribute('data-id');

        if (action === 'close-modal') {
          closeModal();
          return;
        }
        if (action === 'diag-toggle') {
          state.diagExpanded = !state.diagExpanded;
          renderDiagnosticsSticky();
          return;
        }
        if (action === 'diag-recheck') {
          handleRecheckDiagnostics();
          return;
        }
        if (action === 'diag-copy') {
          handleCopyDiagnosticsFixPrompt();
          return;
        }
        if (action === 'diag-dismiss') {
          const sig = (state.diagnostics && state.diagnostics.signature) || '';
          if (sig) {
            state.dismissedDiagSig = sig;
            state.diagExpanded = false;
            try {
              sessionStorage.setItem('__ch_dismissed_diag_sig__', sig);
            } catch {}
            renderDiagnosticsSticky();
          }
          return;
        }
        if (action === 'open-archived-modal') {
          openArchivedModal();
          return;
        }
        if (action === 'confirm-archive-project') {
          const projId = actionBtn.getAttribute('data-project-id');
          const projName = actionBtn.getAttribute('data-project-name') || '';
          const wsKey = actionBtn.getAttribute('data-ws-key') || '';
          handleSetProjectArchived(projId, projName, true, wsKey);
          return;
        }
        if (action === 'confirm-unarchive-project') {
          const projId = actionBtn.getAttribute('data-project-id');
          const projName = actionBtn.getAttribute('data-project-name') || '';
          handleSetProjectArchived(projId, projName, false, '');
          return;
        }
        if (action === 'toggle-card-menu' && convId) {
          state.openMenuConvId = state.openMenuConvId === convId ? null : convId;
          renderAll();
          return;
        }
        if (action === 'archive-conv' && convId) {
          handleSetConversationArchived(convId, true);
          return;
        }
        if (action === 'confirm-unarchive-conv' && convId) {
          handleSetConversationArchived(convId, false);
          return;
        }
        if (action === 'prompt-delete-conv' && convId) {
          const cTitle = actionBtn.getAttribute('data-title') || '';
          openDeleteConvConfirmModal(convId, cTitle);
          return;
        }
        if (action === 'confirm-delete-conv' && convId) {
          const fromArchived = actionBtn.getAttribute('data-from-archived') === '1';
          handleDeleteConversation(convId, fromArchived);
          return;
        }
        if (action === 'toggle-new-chat') {
          const ta = document.getElementById('new-chat-textarea');
          if (ta) state.newChatText = ta.value;
          state.newChatOpen = !state.newChatOpen;
          if (state.newChatOpen && sectionOtherEl && sectionOtherEl.classList.contains('collapsed')) {
            sectionOtherEl.classList.remove('collapsed');
          }
          renderAll();
          if (state.newChatOpen) {
            const nextTa = document.getElementById('new-chat-textarea');
            if (nextTa) nextTa.focus();
          }
          return;
        }
        if (action === 'set-new-chat-scope') {
          const ta = document.getElementById('new-chat-textarea');
          if (ta) state.newChatText = ta.value;
          state.newChatGeneral = actionBtn.getAttribute('data-general') === '1';
          renderAll();
          const nextTa = document.getElementById('new-chat-textarea');
          if (nextTa) nextTa.focus();
          return;
        }
        if (action === 'submit-new-chat') {
          handleStartQuickNewChat();
          return;
        }

        if (action === 'toggle-section') {
          const sec = actionBtn.getAttribute('data-section');
          if (sec === 'other' && sectionOtherEl) {
            const isCollapsed = sectionOtherEl.classList.toggle('collapsed');
            if (!isCollapsed) {
              renderAll();
            }
          }
          return;
        }

        if (action === 'open-chat' && convId) {
          markConversationSeenInServer(convId);
          const curId = state.lastPinnedId || state.hostConvId;
          if (convId !== curId) {
            state.selectedWorkspaceKey = '__auto__';
          }
          if (!initialHostConvId) {
            const targetCard = state.conversations.find((c) => c.id === convId);
            state.hostConvId = convId;
            state.manualPinId = convId;
            state.manualPinTs = Math.max(getCardFocusMs(targetCard), Date.now());
          }
          renderAll();
          claimActiveConversation(convId);
          openConversationInHost(convId);
        } else if (action === 'toggle-details' && convId) {
          toggleDetails(convId);
        } else if (action === 'toggle-handoff' && convId) {
          if (state.pendingSmartHandoff && state.pendingSmartHandoff.convId === convId) {
            cancelPendingSmartHandoff();
            state.openHandoffId = null;
            renderAll();
          } else {
            const onPinnedCard = Boolean(actionBtn.closest('#pinned-container'));
            if (onPinnedCard && (Date.now() - state.lastPollDoneMs) > 250) {
              await fetchStatus(false);
            }
            const targetConvId = onPinnedCard && state.lastPinnedId ? state.lastPinnedId : convId;
            const opening = state.openHandoffId !== targetConvId;
            state.openHandoffId = opening ? targetConvId : null;
            renderAll();
            if (opening) {
              ensureModelsLoaded(targetConvId, false);
            }
          }
        } else if (action === 'cancel-pending-handoff') {
          cancelPendingSmartHandoff();
        } else if (action === 'handoff-smart-run' && convId) {
          handleSmartHandoffRun(convId);
        } else if (action === 'handoff-start-chat' && convId) {
          handleStartNewChatFromHandoff(convId);
        } else if (action === 'handoff-copy' && convId) {
          handleCopyHandoffText(convId);
        } else if (action === 'toggle-clamp') {
          const el = actionBtn.previousElementSibling;
          if (el) {
            const expanded = el.classList.toggle('expanded');
            actionBtn.textContent = expanded ? 'Show less' : 'Show more';
            const expandKey = actionBtn.getAttribute('data-expand-key');
            if (expandKey) {
              if (expanded) state.expandedPromptKeys.add(expandKey);
              else state.expandedPromptKeys.delete(expandKey);
            }
          }
        }
      });

      document.addEventListener('change', (e) => {
        const target = e.target;
        if (!target || !target.classList) return;
        const convId = target.getAttribute('data-conv-id');
        if (!convId) return;
        const card = state.conversations.find((c) => c.id === convId);
        const hState = getHandoffState(convId);

        if (target.classList.contains('handoff-family-select')) {
          const chosenFamily = target.value;
          const groups = groupModelsByFamily(card);
          const grp = groups.find((g) => g.family === chosenFamily);
          if (grp && grp.models.length > 0) {
            const prevSelected = resolveSelectedModelEntry(card);
            const prevTier = (prevSelected && prevSelected.tier) ? prevSelected.tier.toLowerCase() : '';
            const sameTier = prevTier
              ? grp.models.find((m) => (m.tier || '').toLowerCase() === prevTier)
              : null;
            const nextModel = sameTier || grp.models[0];
            hState.selectedModelEnum = nextModel.modelEnum;
            renderAll();
          }
        } else if (target.classList.contains('handoff-tier-select')) {
          hState.selectedModelEnum = target.value;
          renderAll();
        }
      });

      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'new-chat-textarea') {
          state.newChatText = e.target.value;
          return;
        }
        if (e.target && e.target.hasAttribute('data-focus-conv')) {
          const convId = e.target.getAttribute('data-focus-conv');
          const hState = getHandoffState(convId);
          hState.text = e.target.value;
          if (hState.step === 'ready' && e.target.value.trim() === '') {
            hState.step = 'focus';
            hState.text = '';
            state.scrollPositions.set(convId + ':handoff', 0);
            renderAll();
            const nextTa = document.querySelector('textarea.handoff-input[data-focus-conv="' + convId + '"]');
            if (nextTa) {
              nextTa.focus();
            }
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalBackdropEl && modalBackdropEl.classList.contains('open')) {
          e.preventDefault();
          closeModal();
          return;
        }
        if (e.target && e.target.id === 'new-chat-textarea') {
          if (e.key === 'Escape') {
            e.preventDefault();
            state.newChatOpen = false;
            renderAll();
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            handleStartQuickNewChat();
          }
          return;
        }
        if (e.target && e.target.classList && e.target.classList.contains('handoff-input')) {
          if (e.key === 'Escape') {
            e.preventDefault();
            state.openHandoffId = null;
            renderAll();
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            const convId = e.target.getAttribute('data-focus-conv');
            if (convId) {
              const hState = getHandoffState(convId);
              if (hState.step === 'ready') {
                handleStartNewChatFromHandoff(convId);
              } else {
                handleSmartHandoffRun(convId);
              }
            }
          }
        }
      });

      let searchTimer = null;
      searchInput.addEventListener('input', () => {
        state.searchQuery = searchInput.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          fetchStatus(false);
        }, 120);
      });

      function updateWorkspaceUris(uris) {
        const nextUris = Array.isArray(uris) ? uris : [];
        const nextJson = JSON.stringify(nextUris);
        if (nextJson === state.lastWorkspaceUrisJson) return false;
        state.workspaceUris = nextUris;
        state.lastWorkspaceUrisJson = nextJson;
        state.version = 0;
        return true;
      }

      btnRefresh.addEventListener('click', async () => {
        state.selectedWorkspaceKey = '__auto__';
        state.manualPinId = '';
        state.manualPinTs = 0;
        if (window.sidecar && typeof window.sidecar.getWorkspaceUris === 'function') {
          try {
            const uris = await window.sidecar.getWorkspaceUris();
            if (Array.isArray(uris) && uris.length > 0) {
              updateWorkspaceUris(uris);
            }
          } catch {}
        }
        await fetchStatus(true);
        await ensureModelsLoaded(state.hostConvId, true);
        await refreshOpenDetailsDrawers();
        showToast('Refreshed');
      });

      const ACTIVE_CONV_STORAGE_KEY = '__ch_active_conv_id__';

      function isIframeCollapsed() {
        return Boolean(window.innerWidth === 0 && window.innerHeight === 0);
      }

      function isIframeHidden() {
        return Boolean(document.hidden || isIframeCollapsed());
      }

      function resetTransientScopeAndDrawers() {
        let needRender = false;
        if (state.selectedWorkspaceKey !== '__auto__') {
          state.selectedWorkspaceKey = '__auto__';
          needRender = true;
        }
        if (state.openHandoffId && !state.pendingSmartHandoff) {
          state.openHandoffId = null;
          needRender = true;
        }
        if (state.openMenuConvId) {
          state.openMenuConvId = null;
          needRender = true;
        }
        if (needRender) {
          renderAll();
        }
      }

      function isThisIframeActiveConv() {
        if (isIframeHidden()) return false;
        if (document.hasFocus()) return true;
        const myId = (state.lastPinnedId || state.hostConvId || '').trim().toLowerCase();
        try {
          const claimedId = (localStorage.getItem(ACTIVE_CONV_STORAGE_KEY) || '').trim().toLowerCase();
          if (claimedId && myId && claimedId !== myId) return false;
        } catch {}
        return true;
      }

      function claimActiveConversation(explicitConvId) {
        if (!explicitConvId && isIframeHidden()) return;
        const activeId = (explicitConvId || state.lastPinnedId || state.hostConvId || '').trim().toLowerCase();
        if (!activeId) return;
        try {
          if (localStorage.getItem(ACTIVE_CONV_STORAGE_KEY) !== activeId) {
            localStorage.setItem(ACTIVE_CONV_STORAGE_KEY, activeId);
          }
        } catch {}
      }

      window.addEventListener('storage', (ev) => {
        if (!ev || ev.key !== ACTIVE_CONV_STORAGE_KEY) return;
        if (document.hasFocus()) return;
        const newActiveId = (ev.newValue || '').trim().toLowerCase();
        const myId = (state.lastPinnedId || state.hostConvId || '').trim().toLowerCase();
        if (newActiveId && myId && newActiveId !== myId) {
          resetTransientScopeAndDrawers();
        }
      });

      let wasIframeCollapsed = isIframeCollapsed();

      function syncIframeVisibility() {
        const nowCollapsed = isIframeCollapsed();
        if (!wasIframeCollapsed && nowCollapsed) {
          wasIframeCollapsed = true;
          resetTransientScopeAndDrawers();
          return;
        }
        if (wasIframeCollapsed && !nowCollapsed) {
          wasIframeCollapsed = false;
          if (state.selectedWorkspaceKey !== '__auto__') {
            state.selectedWorkspaceKey = '__auto__';
            renderAll();
          }
          claimActiveConversation();
          fetchStatus(false);
        }
      }

      window.addEventListener('resize', () => {
        syncIframeVisibility();
      });

      if (window.sidecar && typeof window.sidecar.onWorkspaceChange === 'function') {
        window.sidecar.onWorkspaceChange((uris) => {
          if (updateWorkspaceUris(uris) || (Date.now() - state.lastPollDoneMs) > 300) {
            fetchStatus(false);
          }
        });
      }

      document.addEventListener('visibilitychange', () => {
        syncIframeVisibility();
        if (!isIframeHidden()) {
          fetchStatus(false);
        }
      });

      window.addEventListener('focus', () => {
        syncIframeVisibility();
        if (!isIframeHidden()) {
          claimActiveConversation();
          fetchStatus(false);
        }
      });

      document.addEventListener('pointerdown', () => {
        if (!isIframeHidden()) {
          claimActiveConversation();
        }
      });

      document.addEventListener('pointerenter', () => {
        syncIframeVisibility();
        if (!isIframeHidden()) {
          claimActiveConversation();
          if ((Date.now() - state.lastPollDoneMs) > 400) {
            fetchStatus(false);
          }
        }
      });

      (async () => {
        if (window.sidecar && typeof window.sidecar.getWorkspaceUris === 'function') {
          try {
            const uris = await window.sidecar.getWorkspaceUris();
            if (Array.isArray(uris) && uris.length > 0) {
              updateWorkspaceUris(uris);
            }
          } catch {}
        }
        await fetchStatus(true);
        if (!isIframeHidden()) {
          claimActiveConversation(state.lastPinnedId || state.hostConvId);
        }
        void ensureModelsLoaded(state.hostConvId, false);
      })();

      setInterval(() => {
        syncIframeVisibility();
        if (!isIframeHidden() || Boolean(state.pendingSmartHandoff)) {
          fetchStatus(false);
        }
      }, 1500);
    })();
  </script>
</body>
</html>
