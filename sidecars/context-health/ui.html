      function renderActiveCardHeader(card) {
        const tier = getCardTier(card);
        statusDotEl.className = 'dot ' + tier.dot;

        const titleText = card.title || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8));

        let gitStatusHtml = '';
        if (card.git && card.git.hasGit) {
          gitStatusHtml = card.git.commitsBehind > 0
            ? '<span class="drift-warn">' + card.git.commitsBehind + ' commit' + (card.git.commitsBehind === 1 ? '' : 's') + ' behind HEAD</span>'
            : '<span class="muted">HEAD in sync</span>';
        }

        const cur = formatTokens(card.currentTokens);
        const ceil = card.observedCeiling > 0 ? '~' + formatTokens(card.observedCeiling) : null;
        let fillPct = 0;
        let barColor = tier.color;
        let rightLabel = '';

        if (card.ceilingExceeded || !card.observedCeiling) {
          fillPct = card.currentTokens > 0 ? 60 : 0;
          rightLabel = card.ceilingExceeded
            ? cur + ' tok (observing new ceiling)'
            : cur + ' tok';
        } else {
          fillPct = Math.round((card.contextRatio || 0) * 100);
          if (fillPct >= 88) barColor = '#ef4444';
          else if (fillPct >= 75) barColor = '#f97316';
          rightLabel = cur + ' / ' + ceil + ' (' + fillPct + '%)';
        }

        const lastCompactLabel = card.compactCount > 0 && card.lastCompactMs
          ? 'Last compact ' + formatRelativeTime(card.lastCompactMs) + ' (' + card.promptsSinceLastCompact + ' prompt' + (card.promptsSinceLastCompact === 1 ? '' : 's') + ' ago)'
          : 'No compactions yet';

        const retentionLabel = card.compactedPrompts > 0
          ? 'Prompts: ' + card.verbatimPrompts + ' full · ' + card.compactedPrompts + ' compacted'
          : 'Prompts: all ' + card.promptCount + ' full';

        const totalTok = Number(card.totalTokens) || 0;
        const totalInTok = Number(card.totalInputTokens) || 0;
        const totalCacheTok = Number(card.totalCacheReadTokens) || 0;
        const totalOutTok = Number(card.totalOutputTokens) || 0;
        const subTok = Number(card.subagentTokens) || 0;

        const totalLabel = formatTokens(totalTok) + ' tok' + (subTok > 0 ? ' (+' + formatTokens(subTok) + ' sub)' : '');
        const breakdownLabel =
          formatTokens(totalInTok) + ' new in · ' +
          formatTokens(totalCacheTok) + ' cached · ' +
          formatTokens(totalOutTok) + ' out';
        const exactTooltip =
          totalTok.toLocaleString('en-US') + ' total tokens (' +
          totalInTok.toLocaleString('en-US') + ' new input · ' +
          totalCacheTok.toLocaleString('en-US') + ' cache read · ' +
          totalOutTok.toLocaleString('en-US') + ' output' +
          (subTok > 0 ? ' · +' + subTok.toLocaleString('en-US') + ' subagents' : '') +
          ')';

        const isDetailsOpen = state.expandedDetails.has(card.id);
        const isHandoffOpen =
          state.openHandoffId === card.id ||
          Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);

        return (
          '<div class="conv-row-top" data-action="open-chat" data-id="' + escapeHtml(card.id) + '" title="Switch to this conversation">' +
            '<span class="conv-title">' + escapeHtml(titleText) + '</span>' +
            '<span class="muted">' + escapeHtml(formatRelativeTime(card.lastActiveMs)) + '</span>' +
          '</div>' +
          '<div class="status-row">' +
            '<div class="status-left">' +
              '<span class="tier-label ' + tier.text + '">' +
                '<span class="dot-sm ' + tier.dot + '"></span>' +
                escapeHtml(tier.label) +
              '</span>' +
              '<span class="muted">· ' + card.compactCount + ' compact' + (card.compactCount === 1 ? '' : 's') + '</span>' +
              '<span class="muted">· ' + card.promptCount + ' prompt' + (card.promptCount === 1 ? '' : 's') + '</span>' +
            '</div>' +
            gitStatusHtml +
          '</div>' +

          '<div class="meter-group">' +
            '<div class="meter-head">' +
              '<span class="muted">Context window</span>' +
              '<span class="mono">' + escapeHtml(rightLabel) + '</span>' +
            '</div>' +
            '<div class="meter-track">' +
              '<div class="meter-fill" style="width:' + fillPct + '%;background:' + barColor + ';"></div>' +
            '</div>' +
            '<div class="meter-foot">' +
              '<span>' + escapeHtml(lastCompactLabel) + '</span>' +
              '<span>' + escapeHtml(retentionLabel) + '</span>' +
            '</div>' +
            '<div class="tokens-summary" title="' + escapeHtml(exactTooltip) + '">' +
              '<div class="meter-head">' +
                '<span class="muted">Total tokens used</span>' +
                '<span class="mono">' + escapeHtml(totalLabel) + '</span>' +
              '</div>' +
              '<div class="meter-foot">' +
                '<span>' + escapeHtml(breakdownLabel) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="actions-bar">' +
            '<div class="actions-left">' +
              '<button class="btn-solid" data-action="toggle-handoff" data-id="' + escapeHtml(card.id) + '">' +
                (isHandoffOpen ? 'Close Handoff' : 'Smart Handoff') +
              '</button>' +
            '</div>' +
            '<button class="ghost-btn" data-action="toggle-details" data-id="' + escapeHtml(card.id) + '">' +
              (isDetailsOpen ? 'Hide History' : 'History &amp; Commits') +
            '</button>' +
          '</div>'
        );
      }

      function renderCompactRowHeader(card, showWorkspaceName) {
        const tier = getCardTier(card);
        const titleText = card.title || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8));
        const lastMsgText = card.lastPrompt || card.firstPrompt || '';
        const showLastMsg = Boolean(lastMsgText && lastMsgText !== titleText);
        const lastMsgHtml = showLastMsg
          ? '<div class="conv-last-msg" data-action="open-chat" data-id="' + escapeHtml(card.id) + '" title="' + escapeHtml(lastMsgText) + '">' + escapeHtml(lastMsgText) + '</div>'
          : '';
        const compactedNote = card.compactedPrompts > 0
          ? ' (' + card.compactedPrompts + ' compacted)'
          : '';

        let gitNoteHtml = '';
        if (card.git && card.git.hasGit) {
          gitNoteHtml = card.git.commitsBehind > 0
            ? '<span class="drift-warn">· ' + card.git.commitsBehind + ' behind</span>'
            : '<span>· HEAD</span>';
        }

        const wsNoteHtml = showWorkspaceName && card.workspaceName
          ? '<span>· ' + escapeHtml(card.workspaceName) + '</span>'
          : '';

        const searchHit = state.searchMatches && state.searchMatches[card.id];
        let searchHitsHtml = '';
        if (searchHit && Array.isArray(searchHit.matchingPrompts) && searchHit.matchingPrompts.length > 0) {
          searchHitsHtml = '<div class="search-hits">';
          for (const mp of searchHit.matchingPrompts) {
            searchHitsHtml += '<div><strong>#' + mp.index + ':</strong> ' + escapeHtml(mp.text.slice(0, 160)) + '</div>';
          }
          searchHitsHtml += '</div>';
        }

        const isHandoffOpen =
          state.openHandoffId === card.id ||
          Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);
        const isDetailsOpen = state.expandedDetails.has(card.id);

        const tokNoteHtml = card.totalTokens > 0
          ? '<span title="' + escapeHtml((Number(card.totalTokens) || 0).toLocaleString('en-US') + ' total tokens used') + '">· ' + escapeHtml(formatTokens(card.totalTokens)) + ' tok</span>'
          : '';

        return (
          '<div class="conv-row-top" data-action="open-chat" data-id="' + escapeHtml(card.id) + '" title="Switch to this conversation">' +
            '<span class="conv-title">' + escapeHtml(titleText) + '</span>' +
            '<span class="muted">' + escapeHtml(formatRelativeTime(card.lastActiveMs)) + '</span>' +
          '</div>' +
          lastMsgHtml +
          '<div class="conv-row-bottom">' +
            '<div class="conv-meta">' +
              '<span class="tier-label ' + tier.text + '">' +
                '<span class="dot-sm ' + tier.dot + '"></span>' +
                escapeHtml(tier.label) + ' · ' + card.compactCount +
              '</span>' +
              '<span>· ' + card.promptCount + ' prompts' + escapeHtml(compactedNote) + '</span>' +
              tokNoteHtml +
              gitNoteHtml +
              wsNoteHtml +
            '</div>' +
            '<div class="conv-actions">' +
              '<button class="ghost-btn" data-action="toggle-handoff" data-id="' + escapeHtml(card.id) + '">' +
                (isHandoffOpen ? 'Close' : 'Handoff') +
              '</button>' +
              '<button class="ghost-btn" data-action="toggle-details" data-id="' + escapeHtml(card.id) + '">' +
                (isDetailsOpen ? 'Hide' : 'History') +
              '</button>' +
            '</div>' +
          '</div>' +
          searchHitsHtml
        );
      }

      function createCardShell(className, headerClassName, convId) {
        const el = document.createElement('div');
        el.className = className;
        el.setAttribute('data-conv-id', convId);
        el.innerHTML =
          '<div class="card-header-slot ' + headerClassName + '"></div>' +
          '<div class="card-handoff-slot card-slot" data-open="0"></div>' +
          '<div class="card-details-slot card-slot" data-rev="0"></div>';
        return el;
      }

      function syncCardDom(cardEl, card, headerHtml) {
        const headerSlot = cardEl.querySelector('.card-header-slot');
        if (headerSlot && headerSlot.innerHTML !== headerHtml) {
          headerSlot.innerHTML = headerHtml;
        }

        const handoffSlot = cardEl.querySelector('.card-handoff-slot');
        const isPending = Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);
        const hState = state.handoffStateByConv.get(card.id);
        const stepTag = hState && hState.step === 'ready' ? 'ready' : 'focus';
        const wantHandoff = isPending
          ? 'pending'
          : (state.openHandoffId === card.id ? stepTag : '0');
        if (handoffSlot && handoffSlot.getAttribute('data-open') !== wantHandoff) {
          handoffSlot.setAttribute('data-open', wantHandoff);
          handoffSlot.innerHTML = wantHandoff !== '0' ? renderHandoffDrawer(card) : '';
          if (wantHandoff !== '0') {
            const ta = handoffSlot.querySelector('textarea.handoff-input');
            if (ta && hState) {
              ta.value = hState.text;
            }
            restoreScrollPositions(handoffSlot);
          }
        } else if (handoffSlot && wantHandoff !== '0') {
          const modelBar = handoffSlot.querySelector('.handoff-model-bar');
          const nextSyncKey = getModelSyncKey(card);
          if (modelBar && modelBar.getAttribute('data-model-sync-key') !== nextSyncKey) {
            modelBar.setAttribute('data-model-sync-key', nextSyncKey);
            modelBar.innerHTML = renderHandoffModelBarInner(card);
          }
        }

        const detailsSlot = cardEl.querySelector('.card-details-slot');
        const details = state.expandedDetails.get(card.id);
        const wantRev = details ? String(details._rev || 1) : '0';
        if (detailsSlot && detailsSlot.getAttribute('data-rev') !== wantRev) {
          detailsSlot.setAttribute('data-rev', wantRev);
          detailsSlot.innerHTML = details ? renderDetailsDrawer(card) : '';
          if (details && !details.loading) {
            restoreScrollPositions(detailsSlot);
          }
        }
      }

      function renderWorkspacePills(effectiveScope, pinnedId) {
        const otherMain = state.conversations.filter((c) => !c.isSubagent && c.id !== pinnedId);
        const countsByWs = new Map();
        for (const c of otherMain) {
          const k = c.workspaceKey || '__unscoped__';
          countsByWs.set(k, (countsByWs.get(k) || 0) + 1);
        }

        let html = '';
        for (const ws of state.workspaces) {
          const otherCount = countsByWs.get(ws.key) || 0;
          if (otherCount === 0 && effectiveScope !== ws.key) continue;
          const isActive = effectiveScope === ws.key;
          const projAttrs = ws.projectId
            ? ' data-project-id="' + escapeHtml(ws.projectId) + '" data-project-name="' + escapeHtml(ws.name) + '"'
            : '';
          const tip = ws.projectId
            ? (ws.path ? ws.path + ' · Right-click to archive project' : 'Right-click to archive project')
            : (ws.path || '');
          html +=
            '<button class="scope-tab ' + (isActive ? 'active' : '') + '" data-ws="' + escapeHtml(ws.key) + '"' + projAttrs + ' title="' + escapeHtml(tip) + '">' +
              escapeHtml(ws.name) + ' (' + otherCount + ')' +
            '</button>';
        }

        html +=
          '<button class="scope-tab ' + (effectiveScope === '__all__' ? 'active' : '') + '" data-ws="__all__">' +
            'All (' + otherMain.length + ')' +
          '</button>';

        if (Array.isArray(state.archivedProjects) && state.archivedProjects.length > 0) {
          html +=
            '<button class="scope-tab scope-tab-archived" data-action="open-archived-modal" title="View and unarchive hidden projects">' +
              'Archived (' + state.archivedProjects.length + ')' +
            '</button>';
        }

        if (workspacePillsEl.innerHTML !== html) {
          workspacePillsEl.innerHTML = html;
        }
      }

      function getCardFocusMs(card) {
        if (!card) return 0;
        return Math.max(Number(card.lastViewMs) || 0, Number(card.lastUserInputMs) || 0);
      }

      function pickMostRecentFocusCard(cards) {
        let best = null;
        let bestFocusMs = -1;
        let bestActiveMs = -1;
        for (const c of cards) {
          const focusMs = getCardFocusMs(c);
          const activeMs = Number(c.lastActiveMs) || 0;
          if (focusMs > bestFocusMs || (focusMs === bestFocusMs && activeMs > bestActiveMs)) {
            bestFocusMs = focusMs;
            bestActiveMs = activeMs;
            best = c;
          }
        }
        return best;
      }

      function renderAll() {
        const mainChats = state.conversations.filter((c) => !c.isSubagent);
        const wsFocusChats = state.activeWorkspaceKey
          ? mainChats.filter((c) => c.workspaceKey === state.activeWorkspaceKey)
          : [];

        if (initialHostConvId) {
          state.hostConvId = initialHostConvId;
        }

        const hostCard = state.hostConvId
          ? state.conversations.find((c) => c.id === state.hostConvId)
          : null;
        const candidatePool = state.activeWorkspaceKey
          ? wsFocusChats
          : (mainChats.length > 0 ? mainChats : state.conversations);
        const newestWsCard = pickMostRecentFocusCard(candidatePool);

        let pinnedCard = initialHostConvId ? hostCard : (hostCard || newestWsCard);
        if (!initialHostConvId) {
          const isManuallyPinned = Boolean(hostCard && state.manualPinId && state.manualPinId === hostCard.id);
          const isPendingOnHost = Boolean(
            hostCard && state.pendingSmartHandoff && state.pendingSmartHandoff.convId === hostCard.id
          );
          const manualPinRecent = Boolean(
            state.manualPinId && (Date.now() - state.manualPinTs) < 15000
          );
          const hostDifferentWs =
            Boolean(state.activeWorkspaceKey) &&
            Boolean(hostCard) &&
            hostCard.workspaceKey !== state.activeWorkspaceKey;

          if (isPendingOnHost) {
            pinnedCard = hostCard;
          } else if (hostCard && hostDifferentWs && !isManuallyPinned) {
            pinnedCard = newestWsCard;
            state.hostConvId = newestWsCard ? newestWsCard.id : '';
          } else if (hostCard && newestWsCard && newestWsCard.id !== hostCard.id) {
            const newestTs = getCardFocusMs(newestWsCard);
            const hostTs = getCardFocusMs(hostCard);
            const newActivityAfterManualPin =
              !state.manualPinId || newestTs > state.manualPinTs;

            if (newestTs > hostTs && newActivityAfterManualPin) {
              pinnedCard = newestWsCard;
              state.hostConvId = newestWsCard.id;
              state.manualPinId = '';
            }
          } else if (!hostCard && newestWsCard && !manualPinRecent) {
            state.hostConvId = newestWsCard.id;
          }
        }

        const pinnedId = pinnedCard ? pinnedCard.id : '';
        if (state.lastPinnedId && pinnedId && state.lastPinnedId !== pinnedId) {
          const isOldPending = Boolean(
            state.pendingSmartHandoff && state.pendingSmartHandoff.convId === state.lastPinnedId
          );
          if (state.openHandoffId === state.lastPinnedId && !isOldPending) {
            state.openHandoffId = null;
          }
        }
        state.lastPinnedId = pinnedId;

        if (pinnedCard) {
          let activeCardEl = pinnedContainer.querySelector('.active-card');
          if (!activeCardEl || activeCardEl.getAttribute('data-conv-id') !== pinnedCard.id) {
            pinnedContainer.innerHTML = '';
            activeCardEl = createCardShell('active-card', 'active-card-header', pinnedCard.id);
            pinnedContainer.appendChild(activeCardEl);
          }
          syncCardDom(activeCardEl, pinnedCard, renderActiveCardHeader(pinnedCard));
          activeWsIndicator.textContent = pinnedCard.workspaceName ? '· ' + pinnedCard.workspaceName : '';
        } else {
          statusDotEl.className = 'dot dot-fresh';
          const emptyPinnedMsg = state.activeWorkspaceKey
            ? 'No active conversation in this workspace yet.'
            : 'No active conversation detected yet.';
          const emptyPinnedHtml = '<div class="empty-box">' + emptyPinnedMsg + '</div>';
          if (pinnedContainer.innerHTML !== emptyPinnedHtml) {
            pinnedContainer.innerHTML = emptyPinnedHtml;
          }
          activeWsIndicator.textContent = '';
        }

        const effectiveScope = resolveEffectiveWorkspaceScope(pinnedCard);
        renderWorkspacePills(effectiveScope, pinnedId);

        const q = state.searchQuery.trim().toLowerCase();
        const filtered = state.conversations.filter((c) => {
          if (c.isSubagent) return false;
          if (c.id === pinnedId) return false;
          if (effectiveScope !== '__all__') {
            const cKey = c.workspaceKey || '__unscoped__';
            if (cKey !== effectiveScope) return false;
          }
          if (q) {
            if (!state.searchMatches || !state.searchMatches[c.id]) return false;
          }
          return true;
        });

        const wsObj = state.workspaces.find((w) => w.key === effectiveScope);
        const scopeTitle = effectiveScope === '__all__'
          ? 'Other conversations (All)'
          : 'Other conversations in ' + ((wsObj && wsObj.name) || 'workspace');
        listHeaderTitle.textContent = scopeTitle;
        listHeaderCount.textContent = filtered.length + ' chat' + (filtered.length === 1 ? '' : 's');

        if (sectionOtherEl && sectionOtherEl.classList.contains('collapsed')) {
          return;
        }

        const showWsName = effectiveScope === '__all__';
        if (filtered.length === 0) {
          const emptyMsg = effectiveScope !== '__all__'
            ? 'No other conversations in this workspace. Select "All" to browse other projects.'
            : 'No other conversations match the current filter.';
          const emptyHtml = '<div class="empty-box">' + emptyMsg + '</div>';
          if (cardsContainer.innerHTML !== emptyHtml) {
            cardsContainer.innerHTML = emptyHtml;
          }
        } else {
          const emptyBox = cardsContainer.querySelector(':scope > .empty-box');
          if (emptyBox) emptyBox.remove();

          const existingById = new Map();
          for (const child of Array.from(cardsContainer.children)) {
            const cid = child.getAttribute && child.getAttribute('data-conv-id');
            if (cid) {
              existingById.set(cid, child);
            } else {
              child.remove();
            }
          }

          const wantedIds = new Set(filtered.map((c) => c.id));
          for (const [cid, el] of existingById.entries()) {
            if (!wantedIds.has(cid)) {
              el.remove();
              existingById.delete(cid);
            }
          }

          const anyRowHasOpenDrawer = filtered.some(
            (c) =>
              state.openHandoffId === c.id ||
              Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === c.id) ||
              state.expandedDetails.has(c.id)
          );

          for (let i = 0; i < filtered.length; i++) {
            const c = filtered[i];
            let rowEl = existingById.get(c.id);
            if (!rowEl) {
              rowEl = createCardShell('conv-row', 'conv-row-header', c.id);
              existingById.set(c.id, rowEl);
              cardsContainer.appendChild(rowEl);
            }
            if (!anyRowHasOpenDrawer && cardsContainer.children[i] !== rowEl) {
              cardsContainer.insertBefore(rowEl, cardsContainer.children[i] || null);
            }
            syncCardDom(rowEl, c, renderCompactRowHeader(c, showWsName));
          }
        }
      }

      async function fetchStatus(force = false) {
        if (!force && state.pollInFlight) return;
        state.pollInFlight = true;
        try {
          const currentQuery = state.searchQuery.trim();
          const queryChanged = currentQuery !== state.lastFetchedQuery;
          const params = new URLSearchParams();
          if (!force && !queryChanged && state.version > 0) {
            params.set('sinceVersion', String(state.version));
          }
          if (force) params.set('force', '1');
          if (state.hostConvId) params.set('activeConvId', state.hostConvId);
          if (state.workspaceUris.length > 0) {
            params.set('workspaceUris', JSON.stringify(state.workspaceUris));
          }
          if (currentQuery) {
            params.set('q', currentQuery);
          }

          const res = await apiFetch('/api/status?' + params.toString());
          if (!res.ok) return;
          const data = await res.json();
          if (data.uiMtimeMs) {
            if (state.uiMtimeMs > 0 && data.uiMtimeMs !== state.uiMtimeMs) {
              window.location.reload();
              return;
            }
            state.uiMtimeMs = data.uiMtimeMs;
          }
          if (data.unchanged && !force && !queryChanged) return;

          state.version = data.version || state.version;
          state.lastFetchedQuery = currentQuery;
          if (data.hostConversationId && !state.hostConvId) {
            state.hostConvId = String(data.hostConversationId).trim().toLowerCase();
          }
          state.activeWorkspaceKey = data.activeWorkspaceKey || '';
          state.workspaces = Array.isArray(data.workspaces) ? data.workspaces : [];
          state.archivedProjects = Array.isArray(data.archivedProjects) ? data.archivedProjects : [];
          if (Array.isArray(data.availableModels) && data.availableModels.length > 0) {
            state.availableModels = data.availableModels;
          }
          if (data.defaultModelEnum) {
            state.defaultModelEnum = data.defaultModelEnum;
          }
          state.conversations = Array.isArray(data.conversations) ? data.conversations : [];
          state.searchMatches = data.searchMatches || null;

          renderAll();
          await checkPendingSmartHandoff();
        } catch (err) {
          console.error('[ContextHealth] status poll failed:', err);
        } finally {
          state.pollInFlight = false;
          state.lastPollDoneMs = Date.now();
        }
      }

      async function ensureModelsLoaded(convId, forceRefresh = false) {
        try {
          const qs = new URLSearchParams();
          if (convId) qs.set('convId', convId);
          if (forceRefresh) qs.set('refresh', '1');
          const res = await apiFetch('/api/models?' + qs.toString());
          if (!res.ok) return;
          const data = await res.json();
          if (Array.isArray(data.models) && data.models.length > 0) {
            state.availableModels = data.models;
          }
          if (data.defaultModelEnum) {
            state.defaultModelEnum = data.defaultModelEnum;
          }
          if (convId && data.convModelEnum) {
            const card = state.conversations.find((c) => c.id === convId);
            if (card) {
              card.modelEnum = data.convModelEnum;
              if (data.convModelLabel) {
                card.modelLabel = data.convModelLabel;
              }
            }
          }
          renderAll();
        } catch {}
      }

      async function refreshOpenDetailsDrawers() {
        const openIds = Array.from(state.expandedDetails.keys());
        if (openIds.length === 0) return;
        await Promise.all(openIds.map(async (convId) => {
          try {
            const res = await apiFetch('/api/conversation-details?id=' + encodeURIComponent(convId));
            if (!res.ok) return;
            const data = await res.json();
            state.detailsRevCounter += 1;
            data._rev = state.detailsRevCounter;
            state.expandedDetails.set(convId, data);
          } catch {}
        }));
        renderAll();
      }

      async function toggleDetails(convId) {
        if (state.expandedDetails.has(convId)) {
          state.expandedDetails.delete(convId);
          renderAll();
          return;
        }
        state.detailsRevCounter += 1;
        state.expandedDetails.set(convId, { loading: true, _rev: state.detailsRevCounter });
        renderAll();
        try {
          const res = await apiFetch('/api/conversation-details?id=' + encodeURIComponent(convId));
          if (!res.ok) throw new Error('Failed to load details');
          const data = await res.json();
          state.detailsRevCounter += 1;
          data._rev = state.detailsRevCounter;
          state.expandedDetails.set(convId, data);
        } catch {
          state.expandedDetails.delete(convId);
          showToast('Failed to load conversation details');
        }
        renderAll();
      }

      function readCurrentHandoffText(convId) {
        const activeTa = document.querySelector('textarea.handoff-input[data-focus-conv="' + convId + '"]');
        const hState = getHandoffState(convId);
        if (activeTa) {
          hState.text = activeTa.value;
        }
        return hState.text || '';
      }

      async function fetchHandoffData(convId, focusText) {
        const focus = (focusText || '').trim();
        const qs = new URLSearchParams({ id: convId });
        if (focus) qs.set('focus', focus);
        const res = await apiFetch('/api/handoff-summary?' + qs.toString());
        if (!res.ok) throw new Error('Failed to build handoff request');
        const data = await res.json();
        return { data, focus };
      }

      function cancelPendingSmartHandoff() {
        state.pendingSmartHandoff = null;
        renderAll();
      }

      async function checkPendingSmartHandoff() {
        const pending = state.pendingSmartHandoff;
        if (!pending || pending.completing) return;

        if (Date.now() - pending.requestedAtMs > 180000) {
          cancelPendingSmartHandoff();
          showToast('Smart handoff timed out waiting for agent response');
          return;
        }

        const conv = state.conversations.find((c) => c.id === pending.convId);
        if (!conv) return;

        const hasNewHandoff =
          Boolean(conv.latestHandoffPrompt) &&
          (conv.latestHandoffMs > pending.baselineHandoffMs ||
            conv.latestHandoffPrompt !== pending.baselinePromptText);

        if (!hasNewHandoff) return;

        pending.completing = true;
        const convId = pending.convId;
        const finalPrompt = conv.latestHandoffPrompt;
        const hState = getHandoffState(convId);
        hState.text = finalPrompt;
        hState.step = 'ready';
        state.openHandoffId = convId;
        state.scrollPositions.set(convId + ':handoff', 0);

        cancelPendingSmartHandoff();
        const activeTa = document.querySelector('textarea.handoff-input[data-focus-conv="' + convId + '"]');
        if (activeTa) {
          activeTa.focus();
        }
        showToast('AI handoff prompt ready for review');
      }

      async function handleSmartHandoffRun(convId) {
        const card = state.conversations.find((c) => c.id === convId);
        const focus = readCurrentHandoffText(convId).trim();
        state.openHandoffId = convId;

        try {
          const { data } = await fetchHandoffData(convId, focus);

          if (window.sidecar && window.sidecar.agent && typeof window.sidecar.agent.sendMessage === 'function') {
            state.pendingSmartHandoff = {
              convId,
              baselineHandoffMs: Math.max((card && card.latestHandoffMs) || 0, data.latestHandoffMs || 0),
              baselinePromptText: data.latestHandoffPrompt || (card && card.latestHandoffPrompt) || '',
              requestedAtMs: Date.now(),
              completing: false
            };
            renderAll();

            try {
              const res = await window.sidecar.agent.sendMessage(data.promptForAgentHandoff, convId);
              if (res && res.error) {
                throw new Error(res.error);
              }
              showToast('Agent is drafting smart handoff...');
              return;
            } catch (agentErr) {
              cancelPendingSmartHandoff();
              console.warn('[ContextHealth] agent sendMessage failed:', agentErr);
              showToast('Agent unavailable: ' + agentErr.message);
              return;
            }
          }

          await copyTextToClipboard(data.promptForAgentHandoff || '');
          showToast('Copied handoff request to clipboard');
        } catch (err) {
          cancelPendingSmartHandoff();
          showToast('Error starting smart handoff: ' + err.message);
        }
      }

      async function handleStartNewChatFromHandoff(convId) {
        const promptText = readCurrentHandoffText(convId).trim();
        if (!promptText) {
          showToast('Handoff prompt is empty');
          return;
        }

        const card = state.conversations.find((c) => c.id === convId);
        const selectedModel = resolveSelectedModelEntry(card);
        try {
          const httpRes = await apiFetch('/_sidecar/new-conversation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: promptText,
              conversationId: convId,
              projectId: (card && card.projectId) || '',
              workspacePath: (card && card.workspacePath) || '',
              model: (selectedModel && selectedModel.modelEnum) || (card && card.modelEnum) || '',
              modelId: (selectedModel && selectedModel.modelId) || ''
            })
          });
          const res = await httpRes.json().catch(() => ({}));
          if (!httpRes.ok || (res && res.error)) {
            throw new Error((res && res.error) || 'Failed to start conversation');
          }
          const rawUuidMatch =
            res && typeof res.raw === 'string'
              ? /([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i.exec(res.raw)
              : null;
          const newConvId = (
            (res && (res.conversationId || res.conversation_id)) ||
            (res && res.response && (res.response.conversationId || res.response.conversation_id)) ||
            (rawUuidMatch ? rawUuidMatch[1] : '') ||
            ''
          ).trim().toLowerCase();
          state.openHandoffId = null;
          state.handoffStateByConv.delete(convId);
          if (newConvId) {
            if (!initialHostConvId) {
              state.hostConvId = newConvId;
              state.manualPinId = newConvId;
              state.manualPinTs = Date.now();
            }
            openConversationInHost(newConvId);
          } else if (!initialHostConvId) {
            state.manualPinId = '';
            state.manualPinTs = 0;
          }
          await fetchStatus(true);
          showToast('Started new conversation with handoff!');
          setTimeout(() => { if (!isIframeHidden()) fetchStatus(true); }, 800);
          setTimeout(() => { if (!isIframeHidden()) fetchStatus(true); }, 2200);
          return;
        } catch (chatErr) {
          console.warn('[ContextHealth] startConversation failed, falling back to clipboard:', chatErr);
          await copyTextToClipboard(promptText);
          showToast('Could not start chat automatically; copied prompt to clipboard');
          return;
        }
      }

      async function handleCopyHandoffText(convId) {
        const promptText = readCurrentHandoffText(convId).trim();
        if (!promptText) {
          showToast('Handoff prompt is empty');
          return;
        }
        await copyTextToClipboard(promptText);
        showToast('Copied handoff prompt');
      }

      function closeModal() {
        if (!modalBackdropEl) return;
        modalBackdropEl.classList.remove('open');
        modalBackdropEl.innerHTML = '';
      }

      function openArchiveConfirmModal(projectId, projectName, wsKey) {
        if (!modalBackdropEl || !projectId) return;
        const safeName = escapeHtml(projectName || 'this project');
        modalBackdropEl.innerHTML =
          '<div class="modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Archive project "' + safeName + '"?</div>' +
            '<div class="modal-body">' +
              'This will temporarily hide <strong>' + safeName + '</strong> and its conversations from both the Antigravity sidebar and Context Health. Nothing is deleted, and you can unarchive it anytime.' +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Cancel</button>' +
              '<button class="btn-primary" data-action="confirm-archive-project" data-project-id="' + escapeHtml(projectId) + '" data-project-name="' + escapeHtml(projectName || '') + '" data-ws-key="' + escapeHtml(wsKey || '') + '">Archive Project</button>' +
            '</div>' +
          '</div>';
        modalBackdropEl.classList.add('open');
      }

      function openArchivedProjectsModal() {
        if (!modalBackdropEl) return;
        const list = Array.isArray(state.archivedProjects) ? state.archivedProjects : [];
        if (list.length === 0) {
          closeModal();
          return;
        }
        let rowsHtml = '';
        for (const p of list) {
          const chatLabel = p.count === 1 ? '1 chat' : (p.count + ' chats');
          rowsHtml +=
            '<div class="modal-row">' +
              '<div class="modal-row-info">' +
                '<span class="modal-row-name">' + escapeHtml(p.name) + '</span>' +
                '<span class="modal-row-sub">' + escapeHtml(chatLabel + (p.path ? ' · ' + p.path : '')) + '</span>' +
              '</div>' +
              '<button class="btn-primary" data-action="confirm-unarchive-project" data-project-id="' + escapeHtml(p.id) + '" data-project-name="' + escapeHtml(p.name) + '">Unarchive</button>' +
            '</div>';
        }
        modalBackdropEl.innerHTML =
          '<div class="modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Archived Projects (' + list.length + ')</div>' +
            '<div class="modal-body">Archived projects are hidden from both the Antigravity sidebar and Context Health. Click Unarchive to restore a project:</div>' +
            '<div class="modal-list">' + rowsHtml + '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Close</button>' +
            '</div>' +
          '</div>';
        modalBackdropEl.classList.add('open');
      }

      async function handleSetProjectArchived(projectId, projectName, archived, wsKey) {
        if (!projectId) return;
        try {
          const res = await apiFetch('/api/project-archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectId, archived: Boolean(archived) })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to update project');
          }
          if (archived && wsKey && state.selectedWorkspaceKey === wsKey) {
            state.selectedWorkspaceKey = '__auto__';
          }
          await fetchStatus(true);
          if (!archived && state.archivedProjects.length > 0 && modalBackdropEl.classList.contains('open')) {
            openArchivedProjectsModal();
          } else {
            closeModal();
          }
          showToast((archived ? 'Archived ' : 'Unarchived ') + (projectName || 'project'));
        } catch (err) {
          closeModal();
          showToast('Error: ' + err.message);
        }
      }

      document.addEventListener('contextmenu', (e) => {
        const wsBtn = e.target.closest('[data-ws][data-project-id]');
        if (wsBtn) {
          e.preventDefault();
          const projId = wsBtn.getAttribute('data-project-id');
          const projName = wsBtn.getAttribute('data-project-name') || '';
          const wsKey = wsBtn.getAttribute('data-ws') || '';
          openArchiveConfirmModal(projId, projName, wsKey);
          return;
        }
        const archBtn = e.target.closest('[data-action="open-archived-modal"]');
        if (archBtn) {
          e.preventDefault();
          openArchivedProjectsModal();
        }
      });

      document.addEventListener('click', async (e) => {
        if (modalBackdropEl && e.target === modalBackdropEl) {
          closeModal();
          return;
        }

        const wsBtn = e.target.closest('[data-ws]');
        if (wsBtn) {
          state.selectedWorkspaceKey = wsBtn.getAttribute('data-ws');
          renderAll();
          return;
        }

        const actionBtn = e.target.closest('[data-action]');
        if (!actionBtn) return;
        const action = actionBtn.getAttribute('data-action');
        const convId = actionBtn.getAttribute('data-id');

        if (action === 'close-modal') {
          closeModal();
          return;
        }
        if (action === 'open-archived-modal') {
          openArchivedProjectsModal();
          return;
        }
        if (action === 'confirm-archive-project') {
          const projId = actionBtn.getAttribute('data-project-id');
          const projName = actionBtn.getAttribute('data-project-name') || '';
          const wsKey = actionBtn.getAttribute('data-ws-key') || '';
          handleSetProjectArchived(projId, projName, true, wsKey);
          return;
        }
        if (action === 'confirm-unarchive-project') {
          const projId = actionBtn.getAttribute('data-project-id');
          const projName = actionBtn.getAttribute('data-project-name') || '';
          handleSetProjectArchived(projId, projName, false, '');
          return;
        }

        if (action === 'toggle-section') {
          const sec = actionBtn.getAttribute('data-section');
          if (sec === 'other' && sectionOtherEl) {
            const isCollapsed = sectionOtherEl.classList.toggle('collapsed');
            if (!isCollapsed) {
              renderAll();
            }
          }
          return;
        }

        if (action === 'open-chat' && convId) {
          if (!initialHostConvId) {
            const targetCard = state.conversations.find((c) => c.id === convId);
            state.hostConvId = convId;
            state.manualPinId = convId;
            state.manualPinTs = Math.max(getCardFocusMs(targetCard), Date.now());
            renderAll();
          }
          openConversationInHost(convId);
        } else if (action === 'toggle-details' && convId) {
          toggleDetails(convId);
        } else if (action === 'toggle-handoff' && convId) {
          if (state.pendingSmartHandoff && state.pendingSmartHandoff.convId === convId) {
            cancelPendingSmartHandoff();
            state.openHandoffId = null;
            renderAll();
          } else {
            const onPinnedCard = Boolean(actionBtn.closest('#pinned-container'));
            if (onPinnedCard && (Date.now() - state.lastPollDoneMs) > 250) {
              await fetchStatus(false);
            }
            const targetConvId = onPinnedCard && state.lastPinnedId ? state.lastPinnedId : convId;
            const opening = state.openHandoffId !== targetConvId;
            state.openHandoffId = opening ? targetConvId : null;
            renderAll();
            if (opening) {
              ensureModelsLoaded(targetConvId, false);
            }
          }
        } else if (action === 'cancel-pending-handoff') {
          cancelPendingSmartHandoff();
        } else if (action === 'handoff-smart-run' && convId) {
          handleSmartHandoffRun(convId);
        } else if (action === 'handoff-start-chat' && convId) {
          handleStartNewChatFromHandoff(convId);
        } else if (action === 'handoff-copy' && convId) {
          handleCopyHandoffText(convId);
        } else if (action === 'toggle-clamp') {
          const el = actionBtn.previousElementSibling;
          if (el) {
            const expanded = el.classList.toggle('expanded');
            actionBtn.textContent = expanded ? 'Show less' : 'Show more';
            const expandKey = actionBtn.getAttribute('data-expand-key');
            if (expandKey) {
              if (expanded) state.expandedPromptKeys.add(expandKey);
              else state.expandedPromptKeys.delete(expandKey);
            }
          }
        }
      });

      document.addEventListener('change', (e) => {
        const target = e.target;
        if (!target || !target.classList) return;
        const convId = target.getAttribute('data-conv-id');
        if (!convId) return;
        const card = state.conversations.find((c) => c.id === convId);
        const hState = getHandoffState(convId);

        if (target.classList.contains('handoff-family-select')) {
          const chosenFamily = target.value;
          const groups = groupModelsByFamily(card);
          const grp = groups.find((g) => g.family === chosenFamily);
          if (grp && grp.models.length > 0) {
            const prevSelected = resolveSelectedModelEntry(card);
            const prevTier = (prevSelected && prevSelected.tier) ? prevSelected.tier.toLowerCase() : '';
            const sameTier = prevTier
              ? grp.models.find((m) => (m.tier || '').toLowerCase() === prevTier)
              : null;
            const nextModel = sameTier || grp.models[0];
            hState.selectedModelEnum = nextModel.modelEnum;
            renderAll();
          }
        } else if (target.classList.contains('handoff-tier-select')) {
          hState.selectedModelEnum = target.value;
          renderAll();
        }
      });

      document.addEventListener('input', (e) => {
        if (e.target && e.target.hasAttribute('data-focus-conv')) {
          const convId = e.target.getAttribute('data-focus-conv');
          const hState = getHandoffState(convId);
          hState.text = e.target.value;
          if (hState.step === 'ready' && e.target.value.trim() === '') {
            hState.step = 'focus';
            hState.text = '';
            state.scrollPositions.set(convId + ':handoff', 0);
            renderAll();
            const nextTa = document.querySelector('textarea.handoff-input[data-focus-conv="' + convId + '"]');
            if (nextTa) {
              nextTa.focus();
            }
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalBackdropEl && modalBackdropEl.classList.contains('open')) {
          e.preventDefault();
          closeModal();
          return;
        }
        if (e.target && e.target.classList && e.target.classList.contains('handoff-input')) {
          if (e.key === 'Escape') {
            e.preventDefault();
            state.openHandoffId = null;
            renderAll();
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            const convId = e.target.getAttribute('data-focus-conv');
            if (convId) {
              const hState = getHandoffState(convId);
              if (hState.step === 'ready') {
                handleStartNewChatFromHandoff(convId);
              } else {
                handleSmartHandoffRun(convId);
              }
            }
          }
        }
      });

      let searchTimer = null;
      searchInput.addEventListener('input', () => {
        state.searchQuery = searchInput.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          fetchStatus(false);
        }, 120);
      });

      function updateWorkspaceUris(uris) {
        const nextUris = Array.isArray(uris) ? uris : [];
        const nextJson = JSON.stringify(nextUris);
        if (nextJson === state.lastWorkspaceUrisJson) return false;
        state.workspaceUris = nextUris;
        state.lastWorkspaceUrisJson = nextJson;
        state.version = 0;
        return true;
      }

      btnRefresh.addEventListener('click', async () => {
        state.selectedWorkspaceKey = '__auto__';
        state.manualPinId = '';
        state.manualPinTs = 0;
        if (window.sidecar && typeof window.sidecar.getWorkspaceUris === 'function') {
          try {
            const uris = await window.sidecar.getWorkspaceUris();
            if (Array.isArray(uris) && uris.length > 0) {
              updateWorkspaceUris(uris);
            }
          } catch {}
        }
        await fetchStatus(true);
        await ensureModelsLoaded(state.hostConvId, true);
        await refreshOpenDetailsDrawers();
        showToast('Refreshed');
      });

      function isIframeHidden() {
        return Boolean(document.hidden || (window.innerWidth === 0 && window.innerHeight === 0));
      }

      let wasIframeHidden = isIframeHidden();

      window.addEventListener('resize', () => {
        const nowHidden = isIframeHidden();
        if (!wasIframeHidden && nowHidden) {
          if (state.openHandoffId && !state.pendingSmartHandoff) {
            state.openHandoffId = null;
            renderAll();
          }
        } else if (wasIframeHidden && !nowHidden) {
          fetchStatus(false);
        }
        wasIframeHidden = nowHidden;
      });

      if (window.sidecar && typeof window.sidecar.onWorkspaceChange === 'function') {
        window.sidecar.onWorkspaceChange((uris) => {
          if (updateWorkspaceUris(uris) || (Date.now() - state.lastPollDoneMs) > 300) {
            fetchStatus(false);
          }
        });
      }

      document.addEventListener('visibilitychange', () => {
        if (!isIframeHidden()) {
          fetchStatus(false);
        }
      });

      window.addEventListener('focus', () => {
        if (!isIframeHidden()) {
          fetchStatus(false);
        }
      });

      document.addEventListener('pointerenter', () => {
        if (!isIframeHidden() && (Date.now() - state.lastPollDoneMs) > 400) {
          fetchStatus(false);
        }
      });

      (async () => {
        if (window.sidecar && typeof window.sidecar.getWorkspaceUris === 'function') {
          try {
            const uris = await window.sidecar.getWorkspaceUris();
            if (Array.isArray(uris) && uris.length > 0) {
              updateWorkspaceUris(uris);
            }
          } catch {}
        }
        await fetchStatus(true);
        void ensureModelsLoaded(state.hostConvId, false);
      })();

      setInterval(() => {
        if (!isIframeHidden() || Boolean(state.pendingSmartHandoff)) {
          fetchStatus(false);
        }
      }, 1500);
    })();
  </script>
</body>
</html>
