<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Context Health</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --background: #101010;
      --foreground: #ededed;
      --card: #1c1c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #10b981;
    }

    .dot-sm {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--foreground, #ededed);
    }

    .brand-ws {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ghost-btn {
      background: transparent;
      color: var(--muted-foreground, #888888);
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 12.5px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }

    .ghost-btn:hover {
      color: var(--foreground, #ededed);
      border-color: var(--border, rgba(255, 255, 255, 0.09));
      background: var(--secondary, rgba(255, 255, 255, 0.04));
    }

    .active-card {
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .active-card-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-slot:empty {
      display: none;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .tier-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13.5px;
    }

    .tier-fresh { color: #34d399; }
    .tier-warm { color: #facc15; }
    .tier-heavy { color: #fb923c; }
    .tier-polluted { color: #f87171; }

    .dot-fresh { background: #10b981; }
    .dot-warm { background: #eab308; }
    .dot-heavy { background: #f97316; }
    .dot-polluted { background: #ef4444; }

    .muted {
      color: var(--muted-foreground, #888888);
      font-size: 12.5px;
      font-weight: 400;
    }

    .drift-warn {
      color: #fb923c;
      font-size: 12.5px;
      font-weight: 400;
    }

    .meter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 400;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground, #ededed);
    }

    .meter-track {
      width: 100%;
      height: 6px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 999px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .meter-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      flex-wrap: wrap;
    }

    .tokens-summary {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 7px;
      margin-top: 2px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.06));
    }

    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 9px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      flex-wrap: wrap;
    }

    .actions-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-solid,
    .btn-primary {
      background: var(--foreground, #ededed);
      color: var(--background, #0a0a0a);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s;
    }

    .btn-solid:hover,
    .btn-primary:hover {
      opacity: 0.88;
    }

    .btn-outline,
    .btn-secondary {
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-outline:hover,
    .btn-secondary:hover {
      background: var(--secondary, rgba(255, 255, 255, 0.06));
      border-color: rgba(255, 255, 255, 0.2);
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.14));
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 2px;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
      transition: opacity 0.12s;
    }

    .section-header:hover {
      opacity: 0.9;
    }

    .section-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .section-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 12px;
      color: var(--muted-foreground, #9a9a9a);
      transition: transform 0.15s ease, color 0.12s;
      flex-shrink: 0;
    }

    .section-header:hover .section-chevron {
      color: var(--foreground, #ededed);
    }

    .section-block.collapsed .section-chevron {
      transform: rotate(-90deg);
    }

    .section-block.collapsed .section-body {
      display: none;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--foreground, #ededed);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground, #a0a0a0);
      background: var(--secondary, rgba(255, 255, 255, 0.06));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 999px;
      padding: 1px 8px;
      flex-shrink: 0;
    }

    .section-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-card {
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 8px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .filter-top-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      width: 100%;
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.12s;
    }

    .search-input::placeholder {
      color: var(--muted-foreground, #777777);
    }

    .search-input:focus {
      border-color: var(--muted-foreground, #888888);
    }

    .btn-new-chat {
      background: var(--secondary, rgba(255, 255, 255, 0.07));
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.14));
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-new-chat:hover,
    .btn-new-chat.active {
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }

    .new-chat-drawer {
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.11));
      border-radius: 7px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .new-chat-scope-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .new-chat-scope-chips {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .scope-chip {
      background: transparent;
      color: var(--muted-foreground, #888888);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.12s, background 0.12s, border-color 0.12s;
    }

    .scope-chip:hover {
      color: var(--foreground, #ededed);
    }

    .scope-chip.active {
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.45);
    }

    .new-chat-textarea {
      width: 100%;
      min-height: 68px;
      max-height: 220px;
      resize: vertical;
      background: var(--card, #141414);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
      border-radius: 6px;
      padding: 7px 9px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.45;
      outline: none;
    }

    .new-chat-textarea:focus {
      border-color: rgba(59, 130, 246, 0.55);
    }

    .scope-tabs {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      max-height: 86px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
    }

    .scope-tabs::-webkit-scrollbar {
      width: 4px;
    }

    .scope-tabs::-webkit-scrollbar-track {
      background: transparent;
    }

    .scope-tabs::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }

    .scope-tabs::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .scope-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      color: var(--muted-foreground, #888888);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 12.5px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.12s, background 0.12s, border-color 0.12s;
    }

    .scope-tab:hover {
      color: var(--foreground, #ededed);
    }

    .scope-tab.active {
      background: var(--secondary, rgba(255, 255, 255, 0.08));
      color: var(--foreground, #ededed);
      border-color: var(--border, rgba(255, 255, 255, 0.14));
      font-weight: 500;
    }

    .scope-tab-archived {
      border: 1px dashed var(--border, rgba(255, 255, 255, 0.14));
      color: var(--muted-foreground, #777777);
      font-size: 12px;
    }

    .scope-tab-archived:hover {
      border-color: var(--muted-foreground, #999999);
      color: var(--foreground, #ededed);
    }

    .unread-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.8);
      flex-shrink: 0;
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      vertical-align: middle;
    }

    .thinking-dots span {
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: #60a5fa;
      animation: chPulseDot 1.2s infinite ease-in-out;
    }

    .thinking-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes chPulseDot {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1.15); }
    }

    .conv-row {
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 8px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: border-color 0.12s;
    }

    .conv-row.is-unread {
      border-color: rgba(59, 130, 246, 0.38);
    }

    .conv-row-header {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .conv-row:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .conv-row.is-unread:hover {
      border-color: rgba(59, 130, 246, 0.55);
    }

    .conv-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    .conv-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .conv-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--foreground, #ededed);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .conv-previews {
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      margin-top: -2px;
    }

    .conv-msg-line {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      line-height: 1.38;
      color: var(--muted-foreground, #888888);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-msg-role {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.01em;
      color: var(--muted-foreground, #777777);
      flex-shrink: 0;
    }

    .conv-msg-ai.unread .conv-msg-role,
    .conv-msg-ai.thinking .conv-msg-role {
      color: #60a5fa;
    }

    .conv-msg-ai.unread .conv-msg-text {
      color: var(--foreground, #e5e5e5);
    }

    .conv-msg-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .conv-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .conv-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
    }

    .conv-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .conv-row .conv-actions {
      width: 100%;
    }

    .card-menu-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .conv-row .card-menu-wrap {
      margin-left: auto;
    }

    .gear-btn {
      padding: 2px 6px;
      font-size: 13px;
      line-height: 1.2;
    }

    .card-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 4px);
      min-width: 118px;
      background: var(--card, #181818);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.16));
      border-radius: 7px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
      z-index: 200;
    }

    .card-menu-item {
      background: transparent;
      border: none;
      border-radius: 5px;
      padding: 5px 9px;
      text-align: left;
      font-size: 12.5px;
      color: var(--foreground, #ededed);
      cursor: pointer;
      transition: background 0.12s;
    }

    .card-menu-item:hover {
      background: var(--secondary, rgba(255, 255, 255, 0.08));
    }

    .card-menu-item.danger {
      color: #f87171;
    }

    .card-menu-item.danger:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    .drawer {
      padding-top: 9px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .handoff-input {
      width: 100%;
      min-height: 120px;
      max-height: 420px;
      resize: vertical;
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
      border-radius: 6px;
      padding: 9px 11px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: hidden;
      overflow-y: auto;
      transition: border-color 0.12s, opacity 0.12s;
    }

    .handoff-input:focus {
      border-color: var(--muted-foreground, #888888);
    }

    .handoff-input[readonly] {
      opacity: 0.65;
      cursor: default;
    }

    .handoff-model-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .handoff-model-group {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .handoff-model-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground, #888888);
      white-space: nowrap;
    }

    .handoff-select {
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.14));
      border-radius: 5px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 12.5px;
      line-height: 1.3;
      outline: none;
      cursor: pointer;
      max-width: 220px;
      transition: border-color 0.12s;
    }

    .handoff-select:hover,
    .handoff-select:focus {
      border-color: var(--muted-foreground, #888888);
    }

    .handoff-select option {
      background: var(--card, #141414);
      color: var(--foreground, #ededed);
    }

    .drawer-subtitle {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted-foreground, #888888);
    }

    .commits-list, .prompts-scroll {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .commit-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 12.5px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.06));
      border-radius: 5px;
      padding: 5px 8px;
    }

    .commit-sha {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #facc15;
      flex-shrink: 0;
    }

    .commit-subj {
      color: var(--foreground, #ededed);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prompt-item {
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.06));
      border-radius: 6px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prompt-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
    }

    .prompt-item-text {
      font-size: 13px;
      color: var(--foreground, #ededed);
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .prompt-item-text.expanded {
      display: block;
      -webkit-line-clamp: unset;
      max-height: 260px;
      overflow-y: auto;
    }

    .expand-link {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--muted-foreground, #888888);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .expand-link:hover {
      color: var(--foreground, #ededed);
    }

    .search-hits {
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .empty-box {
      padding: 16px 12px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.06));
      border-radius: 8px;
    }

    .toast {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: var(--foreground, #ededed);
      color: var(--background, #0a0a0a);
      font-weight: 500;
      font-size: 13px;
      padding: 6px 11px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.15s, transform 0.15s;
      z-index: 9999;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9500;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 340px;
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.14));
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground, #ededed);
    }

    .modal-body {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--muted-foreground, #999999);
    }

    .modal-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }

    .modal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 6px;
    }

    .modal-row-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .modal-row-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground, #ededed);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-row-sub {
      font-size: 11.5px;
      color: var(--muted-foreground, #777777);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 2px;
    }

    .btn-danger {
      background: #dc2626;
      color: #ffffff;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-danger:hover {
      background: #ef4444;
    }

    .shell.has-diag-bar {
      padding-bottom: 58px;
    }

    .diag-sticky {
      position: fixed;
      bottom: 10px;
      left: 12px;
      right: 12px;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .diag-drawer {
      pointer-events: auto;
      background: rgba(20, 20, 20, 0.97);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(251, 146, 60, 0.38);
      border-radius: 9px;
      padding: 11px 12px;
      max-height: 52vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }

    .diag-drawer.is-fail {
      border-color: rgba(248, 113, 113, 0.45);
    }

    .diag-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--foreground, #ededed);
    }

    .diag-issue-card {
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 6px;
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      line-height: 1.42;
    }

    .diag-issue-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .diag-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .diag-badge.fail {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .diag-badge.warn {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .diag-symbol {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--muted-foreground, #888888);
    }

    .diag-bar {
      pointer-events: auto;
      background: rgba(22, 22, 22, 0.96);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(251, 146, 60, 0.42);
      border-radius: 8px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }

    .diag-bar.is-fail {
      border-color: rgba(248, 113, 113, 0.5);
    }

    .diag-bar-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .diag-bar-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #fbbf24;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .diag-bar.is-fail .diag-bar-title {
      color: #f87171;
    }

    .diag-bar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="shell" id="app-shell">
    <div class="top-section">
      <div class="topbar">
        <div class="brand">
          <span class="dot" id="status-dot"></span>
          <span class="brand-title">Context Health</span>
          <span class="brand-ws" id="active-workspace-indicator"></span>
        </div>
        <button class="ghost-btn" id="btn-refresh" title="Refresh">Refresh</button>
      </div>

      <div id="pinned-container"></div>
    </div>

    <div class="section-block" id="section-other">
      <div class="section-header" data-action="toggle-section" data-section="other">
        <div class="section-header-left">
          <span class="section-chevron">▾</span>
          <span class="section-title" id="list-header-title">Other conversations</span>
        </div>
        <span class="section-badge" id="list-header-count"></span>
      </div>
      <div class="section-body">
        <div class="filter-card">
          <div class="filter-top-row">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Filter conversations or prompts..."
            />
            <button class="btn-new-chat" id="btn-toggle-new-chat" data-action="toggle-new-chat" title="Start a new conversation">+ New</button>
          </div>
          <div id="new-chat-slot" class="card-slot"></div>
          <div class="scope-tabs" id="workspace-pills"></div>
        </div>
        <div id="cards-container" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>
  </div>

  <div class="diag-sticky" id="diag-sticky" style="display:none;"></div>
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      let initialHostConvId = (
        (window.sidecar && window.sidecar.conversationId) ||
        new URLSearchParams(window.location.search).get('conversationId') ||
        (window.__SIDECAR_BOOT__ && window.__SIDECAR_BOOT__.conversationId) ||
        ''
      ).trim().toLowerCase();

      try {
        const cachedTheme = sessionStorage.getItem('__ch_theme_vars__');
        if (cachedTheme) {
          const parsedVars = JSON.parse(cachedTheme);
          for (const [k, v] of Object.entries(parsedVars)) {
            document.documentElement.style.setProperty(k, v);
          }
        }
      } catch {}
      window.addEventListener('message', (ev) => {
        if (ev.data && ev.data.type === 'theme-change' && ev.data.payload && ev.data.payload.cssVariables) {
          try {
            sessionStorage.setItem('__ch_theme_vars__', JSON.stringify(ev.data.payload.cssVariables));
          } catch {}
        }
      });

      const urlSimulateDiag = (new URLSearchParams(window.location.search).get('simulateDiag') || '').trim();
      let initialDismissedDiagSig = '';
      try {
        initialDismissedDiagSig = sessionStorage.getItem('__ch_dismissed_diag_sig__') || '';
      } catch {}

      const state = {
        version: 0,
        uiMtimeMs: 0,
        hostConvId: initialHostConvId,
        lastPinnedId: '',
        manualPinId: '',
        manualPinTs: 0,
        detailsRevCounter: 0,
        scrollPositions: new Map(),
        workspaceUris: [],
        lastWorkspaceUrisJson: '[]',
        pollInFlight: false,
        lastPollDoneMs: 0,
        selectedWorkspaceKey: '__auto__',
        searchQuery: '',
        lastFetchedQuery: '',
        conversations: [],
        workspaces: [],
        archivedProjects: [],
        archivedConversations: [],
        availableModels: [],
        defaultModelEnum: '',
        activeWorkspaceKey: '',
        searchMatches: null,
        diagnostics: null,
        diagExpanded: false,
        diagRechecking: false,
        dismissedDiagSig: initialDismissedDiagSig,
        expandedDetails: new Map(),
        expandedPromptKeys: new Set(),
        openHandoffId: null,
        pendingSmartHandoff: null,
        handoffStateByConv: new Map(),
        openMenuConvId: null,
        newChatOpen: false,
        newChatText: '',
        newChatGeneral: false,
        newChatSending: false
      };

      const appShellEl = document.getElementById('app-shell');
      const diagStickyEl = document.getElementById('diag-sticky');
      const pinnedContainer = document.getElementById('pinned-container');
      const cardsContainer = document.getElementById('cards-container');
      const workspacePillsEl = document.getElementById('workspace-pills');
      const newChatSlotEl = document.getElementById('new-chat-slot');
      const btnToggleNewChatEl = document.getElementById('btn-toggle-new-chat');
      const searchInput = document.getElementById('search-input');
      const activeWsIndicator = document.getElementById('active-workspace-indicator');
      const listHeaderTitle = document.getElementById('list-header-title');
      const listHeaderCount = document.getElementById('list-header-count');
      const sectionOtherEl = document.getElementById('section-other');
      const statusDotEl = document.getElementById('status-dot');
      const btnRefresh = document.getElementById('btn-refresh');
      const modalBackdropEl = document.getElementById('modal-backdrop');
      const toastEl = document.getElementById('toast');

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('visible');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          toastEl.classList.remove('visible');
        }, 2000);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatRelativeTime(isoOrMs) {
        if (!isoOrMs) return '';
        const ms = typeof isoOrMs === 'number' ? isoOrMs : Date.parse(isoOrMs);
        if (!Number.isFinite(ms) || ms <= 0) return '';
        const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
        if (diffSec < 45) return 'just now';
        const mins = Math.floor(diffSec / 60);
        if (mins < 60) return mins + 'm ago';
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h ago';
        const days = Math.floor(hours / 24);
        if (days < 30) return days + 'd ago';
        return Math.floor(days / 30) + 'mo ago';
      }

      function formatTokens(tok) {
        if (!tok || tok <= 0) return '0';
        if (tok >= 1000000) return (tok / 1000000).toFixed(2) + 'M';
        if (tok >= 1000) return (tok / 1000).toFixed(1) + 'k';
        return String(tok);
      }

      async function copyTextToClipboard(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch {}
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch {}
        document.body.removeChild(ta);
        return ok;
      }

      function apiFetch(urlPath, options = {}) {
        if (window.sidecar && typeof window.sidecar.fetch === 'function') {
          return window.sidecar.fetch(urlPath, options);
        }
        return fetch(urlPath, options);
      }

      function openConversationInHost(convId) {
        if (window.sidecar && window.sidecar.ui && typeof window.sidecar.ui.toggleConversation === 'function') {
          window.sidecar.ui.toggleConversation(convId);
        }
      }

      function resolveEffectiveWorkspaceScope(activeCard) {
        if (state.selectedWorkspaceKey !== '__auto__') {
          return state.selectedWorkspaceKey;
        }
        if (activeCard && activeCard.workspaceKey) {
          return activeCard.workspaceKey;
        }
        if (activeCard && !activeCard.workspaceKey && activeCard.promptCount > 0) {
          if (state.workspaces.some((w) => w.key === '__unscoped__')) {
            return '__unscoped__';
          }
        }
        if (state.activeWorkspaceKey) {
          return state.activeWorkspaceKey;
        }
        return '__all__';
      }

      const TIER_UI = {
        fresh: { id: 'fresh', label: 'Fresh', text: 'tier-fresh', dot: 'dot-fresh', color: '#10b981' },
        warm: { id: 'warm', label: 'Warm', text: 'tier-warm', dot: 'dot-warm', color: '#eab308' },
        heavy: { id: 'heavy', label: 'Heavy', text: 'tier-heavy', dot: 'dot-heavy', color: '#f97316' },
        polluted: { id: 'polluted', label: 'Polluted', text: 'tier-polluted', dot: 'dot-polluted', color: '#ef4444' }
      };

      function getCardTier(card) {
        const id = (card && card.pollution && card.pollution.id) || 'fresh';
        return TIER_UI[id] || TIER_UI.fresh;
      }

      document.addEventListener('scroll', (e) => {
        const el = e.target;
        if (el && el.getAttribute) {
          const key = el.getAttribute('data-scroll-key');
          if (key) {
            state.scrollPositions.set(key, el.scrollTop);
          }
        }
      }, true);

      function restoreScrollPositions(rootEl) {
        if (!rootEl || !rootEl.querySelectorAll) return;
        const scrollables = rootEl.querySelectorAll('[data-scroll-key]');
        for (const el of scrollables) {
          const key = el.getAttribute('data-scroll-key');
          if (key && state.scrollPositions.has(key)) {
            el.scrollTop = state.scrollPositions.get(key);
          }
        }
      }

      function renderDetailsDrawer(card) {
        const details = state.expandedDetails.get(card.id);
        if (!details) return '';
        if (details.loading) {
          return '<div class="drawer"><span class="muted">Loading history...</span></div>';
        }

        let html = '<div class="drawer">';

        if (Array.isArray(details.missedCommits) && details.missedCommits.length > 0) {
          html += '<div class="drawer-subtitle">Missed commits (' + details.commitsBehind + ' behind HEAD)</div>';
          html += '<div class="commits-list" data-scroll-key="' + escapeHtml(card.id + ':commits') + '">';
          for (const c of details.missedCommits) {
            html +=
              '<div class="commit-row">' +
                '<span class="commit-sha">' + escapeHtml(c.short) + '</span>' +
                '<span class="commit-subj">' + escapeHtml(c.subject) + '</span>' +
                '<span class="muted">' + escapeHtml(formatRelativeTime(c.tsMs || c.iso)) + '</span>' +
              '</div>';
          }
          html += '</div>';
        }

        if (details.checkpointOverview) {
          const ovKey = card.id + ':overview';
          const ovExpanded = state.expandedPromptKeys.has(ovKey);
          html +=
            '<div class="drawer-subtitle">Latest compact overview</div>' +
            '<div class="prompt-item">' +
              '<div class="prompt-item-text' + (ovExpanded ? ' expanded' : '') + '" data-scroll-key="' + escapeHtml(ovKey) + '">' +
                escapeHtml(details.checkpointOverview) +
              '</div>' +
              '<button class="expand-link" data-action="toggle-clamp" data-expand-key="' + escapeHtml(ovKey) + '">' +
                (ovExpanded ? 'Show less' : 'Show more') +
              '</button>' +
            '</div>';
        }

        const prompts = Array.isArray(details.prompts) ? details.prompts : [];
        html += '<div class="drawer-subtitle">User prompts (' + prompts.length + ')</div>';
        if (prompts.length === 0) {
          html += '<div class="muted">No user prompts recorded.</div>';
        } else {
          html += '<div class="prompts-scroll" data-scroll-key="' + escapeHtml(card.id + ':prompts') + '">';
          for (const p of prompts) {
            const needsExpand = (p.text || '').length > 160 || (p.text || '').split('\n').length > 3;
            const pKey = card.id + ':' + p.index;
            const pExpanded = state.expandedPromptKeys.has(pKey);
            html +=
              '<div class="prompt-item">' +
                '<div class="prompt-item-head">' +
                  '<span>#' + p.index + '</span>' +
                  '<span>' + escapeHtml(formatRelativeTime(p.createdAt)) + '</span>' +
                '</div>' +
                '<div class="prompt-item-text' + (pExpanded ? ' expanded' : '') + '" data-scroll-key="' + escapeHtml(pKey) + '">' + escapeHtml(p.text) + '</div>' +
                (needsExpand
                  ? '<button class="expand-link" data-action="toggle-clamp" data-expand-key="' + escapeHtml(pKey) + '">' +
                      (pExpanded ? 'Show less' : 'Show more') +
                    '</button>'
                  : '') +
              '</div>';
          }
          html += '</div>';
        }

        html += '</div>';
        return html;
      }

      function getHandoffState(convId) {
        let st = state.handoffStateByConv.get(convId);
        if (!st) {
          st = {
            step: 'focus',
            text: '',
            selectedModelEnum: null
          };
          state.handoffStateByConv.set(convId, st);
        }
        return st;
      }

      function parseLabelFamilyAndTier(label) {
        const clean = (label || '').trim();
        const m = /^(.+?)\s*\(([^()]+)\)$/.exec(clean);
        if (m) {
          return { family: m[1].trim(), tier: m[2].trim() };
        }
        return { family: clean || 'Default Model', tier: '' };
      }

      function getEffectiveModelsForCard(card) {
        const list = Array.isArray(state.availableModels) ? state.availableModels.slice() : [];
        if (card && card.modelEnum) {
          const exists = list.some((m) => m.modelEnum === card.modelEnum);
          if (!exists) {
            const label = card.modelLabel || card.modelEnum;
            const parsed = parseLabelFamilyAndTier(label);
            list.unshift({
              modelEnum: card.modelEnum,
              modelId: '',
              label,
              family: parsed.family,
              tier: parsed.tier
            });
          }
        }
        return list;
      }

      function groupModelsByFamily(card) {
        const list = getEffectiveModelsForCard(card);
        const byFamily = new Map();
        const groups = [];
        for (const m of list) {
          const fam = m.family || m.label || m.modelEnum;
          let g = byFamily.get(fam);
          if (!g) {
            g = { family: fam, models: [] };
            byFamily.set(fam, g);
            groups.push(g);
          }
          g.models.push(m);
        }
        return groups;
      }

      function resolveSelectedModelEntry(card) {
        const hState = card ? getHandoffState(card.id) : null;
        const list = getEffectiveModelsForCard(card);
        const wantedEnum =
          (hState && hState.selectedModelEnum) ||
          (card && card.modelEnum) ||
          state.defaultModelEnum ||
          (list[0] && list[0].modelEnum) ||
          '';
        if (!wantedEnum) return null;
        const found = list.find((m) => m.modelEnum === wantedEnum);
        if (found) return found;
        return list[0] || null;
      }

      function getModelSyncKey(card) {
        if (!card) return '';
        const hState = state.handoffStateByConv.get(card.id);
        const sel = (hState && hState.selectedModelEnum) || '';
        const catKey = Array.isArray(state.availableModels)
          ? state.availableModels.map((m) => m.modelEnum).join(',')
          : '';
        return [catKey, state.defaultModelEnum || '', card.modelEnum || '', card.modelLabel || '', sel].join('|');
      }

      function renderHandoffModelBarInner(card) {
        const groups = groupModelsByFamily(card);
        const selected = resolveSelectedModelEntry(card);
        if (groups.length === 0 || !selected) {
          return '<span class="handoff-model-label">Model: detecting available models...</span>';
        }
        const idEsc = escapeHtml(card.id);
        const selectedGroup = groups.find((g) => g.family === selected.family) || groups[0];
        let familyOpts = '';
        for (const g of groups) {
          const isSel = g.family === selectedGroup.family ? ' selected' : '';
          familyOpts +=
            '<option value="' + escapeHtml(g.family) + '"' + isSel + '>' +
              escapeHtml(g.family) +
            '</option>';
        }

        let html =
          '<div class="handoff-model-group">' +
            '<span class="handoff-model-label">Model</span>' +
            '<select class="handoff-select handoff-family-select" data-conv-id="' + idEsc + '">' +
              familyOpts +
            '</select>' +
          '</div>';

        const hasTiers =
          selectedGroup.models.length > 1 ||
          Boolean(selectedGroup.models[0] && selectedGroup.models[0].tier);
        if (hasTiers) {
          let tierOpts = '';
          for (const m of selectedGroup.models) {
            const tierLabel = m.tier || 'Default';
            const isSel = m.modelEnum === selected.modelEnum ? ' selected' : '';
            tierOpts +=
              '<option value="' + escapeHtml(m.modelEnum) + '"' + isSel + '>' +
                escapeHtml(tierLabel) +
              '</option>';
          }
          html +=
            '<div class="handoff-model-group">' +
              '<span class="handoff-model-label">Thinking</span>' +
              '<select class="handoff-select handoff-tier-select" data-conv-id="' + idEsc + '">' +
                tierOpts +
              '</select>' +
            '</div>';
        }
        return html;
      }

      function renderHandoffDrawer(card) {
        const isPending = Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);
        if (!isPending && state.openHandoffId !== card.id) return '';

        const hState = getHandoffState(card.id);
        const idEsc = escapeHtml(card.id);
        let subtitleHtml = '';
        let placeholder = 'Optional instructions or focus for the AI handoff prompt (leave empty for full task handoff)...';
        let rows = 6;
        let readonlyAttr = '';
        let buttonsHtml =
          '<button class="btn-solid" data-action="handoff-smart-run" data-id="' + idEsc + '">' +
            'Generate Handoff Prompt' +
          '</button>';

        if (isPending) {
          subtitleHtml =
            '<div class="drawer-subtitle" style="color:var(--foreground, #ededed);">' +
              'Agent is generating AI handoff prompt...' +
            '</div>';
          placeholder = 'Waiting for AI handoff prompt...';
          readonlyAttr = ' readonly';
          buttonsHtml =
            '<button class="btn-solid" disabled>Generating...</button>' +
            '<button class="ghost-btn" data-action="cancel-pending-handoff" data-id="' + idEsc + '">' +
              'Cancel' +
            '</button>';
        } else if (hState.step === 'ready') {
          subtitleHtml =
            '<div class="drawer-subtitle" style="color:#34d399;">' +
              'Review and edit AI handoff prompt before starting new chat' +
            '</div>';
          placeholder = 'Handoff prompt for the new conversation...';
          rows = 8;
          buttonsHtml =
            '<button class="btn-solid" data-action="handoff-start-chat" data-id="' + idEsc + '">' +
              'Start New Chat' +
            '</button>' +
            '<button class="btn-outline" data-action="handoff-copy" data-id="' + idEsc + '">' +
              'Copy' +
            '</button>';
        }

        const modelBarHtml =
          '<div class="handoff-model-bar" data-model-sync-key="' + escapeHtml(getModelSyncKey(card)) + '">' +
            renderHandoffModelBarInner(card) +
          '</div>';

        return (
          '<div class="drawer">' +
            subtitleHtml +
            '<textarea ' +
              'class="handoff-input" ' +
              'data-focus-conv="' + idEsc + '" ' +
              'data-scroll-key="' + escapeHtml(card.id + ':handoff') + '" ' +
              'placeholder="' + placeholder + '" ' +
              'rows="' + rows + '"' +
              readonlyAttr + '>' +
              escapeHtml(hState.text) +
            '</textarea>' +
            modelBarHtml +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
              buttonsHtml +
            '</div>' +
          '</div>'
        );
      }

      function renderActiveCardHeader(card) {
        const tier = getCardTier(card);
        statusDotEl.className = 'dot ' + tier.dot;

        const titleText = card.title || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8));

        let gitStatusHtml = '';
        if (card.git && card.git.hasGit) {
          gitStatusHtml = card.git.commitsBehind > 0
            ? '<span class="drift-warn">' + card.git.commitsBehind + ' commit' + (card.git.commitsBehind === 1 ? '' : 's') + ' behind HEAD</span>'
            : '<span class="muted">HEAD in sync</span>';
        }

        const cur = formatTokens(card.currentTokens);
        const ceil = card.observedCeiling > 0 ? '~' + formatTokens(card.observedCeiling) : null;
        let fillPct = 0;
        let barColor = tier.color;
        let rightLabel = '';

        if (card.ceilingExceeded || !card.observedCeiling) {
          fillPct = card.currentTokens > 0 ? 60 : 0;
          rightLabel = card.ceilingExceeded
            ? cur + ' tok (observing new ceiling)'
            : cur + ' tok';
        } else {
          fillPct = Math.round((card.contextRatio || 0) * 100);
          if (fillPct >= 88) barColor = '#ef4444';
          else if (fillPct >= 75) barColor = '#f97316';
          rightLabel = cur + ' / ' + ceil + ' (' + fillPct + '%)';
        }

        const lastCompactLabel = card.compactCount > 0 && card.lastCompactMs
          ? 'Last compact ' + formatRelativeTime(card.lastCompactMs) + ' (' + card.promptsSinceLastCompact + ' prompt' + (card.promptsSinceLastCompact === 1 ? '' : 's') + ' ago)'
          : 'No compactions yet';

        const retentionLabel = card.compactedPrompts > 0
          ? 'Prompts: ' + card.verbatimPrompts + ' full · ' + card.compactedPrompts + ' compacted'
          : 'Prompts: all ' + card.promptCount + ' full';

        const totalTok = Number(card.totalTokens) || 0;
        const totalInTok = Number(card.totalInputTokens) || 0;
        const totalCacheTok = Number(card.totalCacheReadTokens) || 0;
        const totalOutTok = Number(card.totalOutputTokens) || 0;
        const subTok = Number(card.subagentTokens) || 0;

        const totalLabel = formatTokens(totalTok) + ' tok' + (subTok > 0 ? ' (+' + formatTokens(subTok) + ' sub)' : '');
        const breakdownLabel =
          formatTokens(totalInTok) + ' new in · ' +
          formatTokens(totalCacheTok) + ' cached · ' +
          formatTokens(totalOutTok) + ' out';
        const exactTooltip =
          totalTok.toLocaleString('en-US') + ' total tokens (' +
          totalInTok.toLocaleString('en-US') + ' new input · ' +
          totalCacheTok.toLocaleString('en-US') + ' cache read · ' +
          totalOutTok.toLocaleString('en-US') + ' output' +
          (subTok > 0 ? ' · +' + subTok.toLocaleString('en-US') + ' subagents' : '') +
          ')';

        const isDetailsOpen = state.expandedDetails.has(card.id);
        const isHandoffOpen =
          state.openHandoffId === card.id ||
          Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);

        return (
          '<div class="conv-row-top" data-action="open-chat" data-id="' + escapeHtml(card.id) + '" title="Switch to this conversation">' +
            '<span class="conv-title">' + escapeHtml(titleText) + '</span>' +
            '<span class="muted">' + escapeHtml(formatRelativeTime(card.lastActiveMs)) + '</span>' +
          '</div>' +
          '<div class="status-row">' +
            '<div class="status-left">' +
              '<span class="tier-label ' + tier.text + '">' +
                '<span class="dot-sm ' + tier.dot + '"></span>' +
                escapeHtml(tier.label) +
              '</span>' +
              '<span class="muted">· ' + card.compactCount + ' compact' + (card.compactCount === 1 ? '' : 's') + '</span>' +
              '<span class="muted">· ' + card.promptCount + ' prompt' + (card.promptCount === 1 ? '' : 's') + '</span>' +
            '</div>' +
            gitStatusHtml +
          '</div>' +

          '<div class="meter-group">' +
            '<div class="meter-head">' +
              '<span class="muted">Context window</span>' +
              '<span class="mono">' + escapeHtml(rightLabel) + '</span>' +
            '</div>' +
            '<div class="meter-track">' +
              '<div class="meter-fill" style="width:' + fillPct + '%;background:' + barColor + ';"></div>' +
            '</div>' +
            '<div class="meter-foot">' +
              '<span>' + escapeHtml(lastCompactLabel) + '</span>' +
              '<span>' + escapeHtml(retentionLabel) + '</span>' +
            '</div>' +
            '<div class="tokens-summary" title="' + escapeHtml(exactTooltip) + '">' +
              '<div class="meter-head">' +
                '<span class="muted">Total tokens used</span>' +
                '<span class="mono">' + escapeHtml(totalLabel) + '</span>' +
              '</div>' +
              '<div class="meter-foot">' +
                '<span>' + escapeHtml(breakdownLabel) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="actions-bar">' +
            '<div class="actions-left">' +
              '<button class="btn-solid" data-action="toggle-handoff" data-id="' + escapeHtml(card.id) + '">' +
                (isHandoffOpen ? 'Close Handoff' : 'Smart Handoff') +
              '</button>' +
            '</div>' +
            '<div class="conv-actions">' +
              '<button class="ghost-btn" data-action="toggle-details" data-id="' + escapeHtml(card.id) + '">' +
                (isDetailsOpen ? 'Hide History' : 'History &amp; Commits') +
              '</button>' +
              renderCardGearMenu(card) +
            '</div>' +
          '</div>'
        );
      }

      function renderCardGearMenu(card) {
        const idEsc = escapeHtml(card.id);
        const titleEsc = escapeHtml(card.title || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8)));
        const isMenuOpen = state.openMenuConvId === card.id;
        return (
          '<div class="card-menu-wrap">' +
            '<button class="ghost-btn gear-btn" data-action="toggle-card-menu" data-id="' + idEsc + '" title="Conversation actions" aria-label="Conversation actions">⚙</button>' +
            (isMenuOpen
              ? '<div class="card-menu">' +
                  '<button class="card-menu-item" data-action="archive-conv" data-id="' + idEsc + '">Archive</button>' +
                  '<button class="card-menu-item danger" data-action="prompt-delete-conv" data-id="' + idEsc + '" data-title="' + titleEsc + '">Delete</button>' +
                '</div>'
              : '') +
          '</div>'
        );
      }

      function renderCompactRowHeader(card, showWorkspaceName) {
        const tier = getCardTier(card);
        const titleText = card.title || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8));
        const userMsgText = (card.lastPrompt || card.firstPrompt || '').trim();
        const aiMsgText = (card.lastModelResponse || '').trim();

        let statusBadgeHtml = '';
        if (card.isThinking) {
          statusBadgeHtml = '<span class="thinking-dots" title="Agent is thinking"><span></span><span></span><span></span></span>';
        } else if (card.unread) {
          statusBadgeHtml = '<span class="unread-dot" title="Unread reply"></span>';
        }

        let previewsHtml = '';
        const showUserLine = Boolean(userMsgText);
        const showAiLine = Boolean(card.isThinking || aiMsgText);
        if (showUserLine || showAiLine) {
          previewsHtml += '<div class="conv-previews" data-action="open-chat" data-id="' + escapeHtml(card.id) + '">';
          if (showUserLine) {
            previewsHtml +=
              '<div class="conv-msg-line" title="' + escapeHtml(userMsgText) + '">' +
                '<span class="conv-msg-role">You:</span>' +
                '<span class="conv-msg-text">' + escapeHtml(userMsgText) + '</span>' +
              '</div>';
          }
          if (card.isThinking) {
            previewsHtml +=
              '<div class="conv-msg-line conv-msg-ai thinking" title="' + escapeHtml(aiMsgText || 'Agent is thinking...') + '">' +
                '<span class="conv-msg-role">AI:</span>' +
                '<span class="conv-msg-text">' + escapeHtml(aiMsgText || 'Thinking...') + '</span>' +
              '</div>';
          } else if (aiMsgText) {
            previewsHtml +=
              '<div class="conv-msg-line conv-msg-ai' + (card.unread ? ' unread' : '') + '" title="' + escapeHtml(aiMsgText) + '">' +
                '<span class="conv-msg-role">AI:</span>' +
                '<span class="conv-msg-text">' + escapeHtml(aiMsgText) + '</span>' +
              '</div>';
          }
          previewsHtml += '</div>';
        }

        const compactedNote = card.compactedPrompts > 0
          ? ' (' + card.compactedPrompts + ' compacted)'
          : '';

        let gitNoteHtml = '';
        if (card.git && card.git.hasGit) {
          gitNoteHtml = card.git.commitsBehind > 0
            ? '<span class="drift-warn">· ' + card.git.commitsBehind + ' behind</span>'
            : '<span>· HEAD</span>';
        }

        const wsNoteHtml = showWorkspaceName && card.workspaceName
          ? '<span>· ' + escapeHtml(card.workspaceName) + '</span>'
          : '';

        const searchHit = state.searchMatches && state.searchMatches[card.id];
        let searchHitsHtml = '';
        if (searchHit && Array.isArray(searchHit.matchingPrompts) && searchHit.matchingPrompts.length > 0) {
          searchHitsHtml = '<div class="search-hits">';
          for (const mp of searchHit.matchingPrompts) {
            searchHitsHtml += '<div><strong>#' + mp.index + ':</strong> ' + escapeHtml(mp.text.slice(0, 160)) + '</div>';
          }
          searchHitsHtml += '</div>';
        }

        const isHandoffOpen =
          state.openHandoffId === card.id ||
          Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);
        const isDetailsOpen = state.expandedDetails.has(card.id);

        const tokNoteHtml = card.totalTokens > 0
          ? '<span title="' + escapeHtml((Number(card.totalTokens) || 0).toLocaleString('en-US') + ' total tokens used') + '">· ' + escapeHtml(formatTokens(card.totalTokens)) + ' tok</span>'
          : '';

        return (
          '<div class="conv-row-top" data-action="open-chat" data-id="' + escapeHtml(card.id) + '" title="Switch to this conversation">' +
            '<div class="conv-title-wrap">' +
              statusBadgeHtml +
              '<span class="conv-title">' + escapeHtml(titleText) + '</span>' +
            '</div>' +
            '<span class="muted">' + escapeHtml(formatRelativeTime(card.lastActiveMs)) + '</span>' +
          '</div>' +
          previewsHtml +
          '<div class="conv-row-bottom">' +
            '<div class="conv-meta">' +
              '<span class="tier-label ' + tier.text + '">' +
                '<span class="dot-sm ' + tier.dot + '"></span>' +
                escapeHtml(tier.label) + ' · ' + card.compactCount +
              '</span>' +
              '<span>· ' + card.promptCount + ' prompts' + escapeHtml(compactedNote) + '</span>' +
              tokNoteHtml +
              gitNoteHtml +
              wsNoteHtml +
            '</div>' +
            '<div class="conv-actions">' +
              '<button class="ghost-btn" data-action="toggle-handoff" data-id="' + escapeHtml(card.id) + '">' +
                (isHandoffOpen ? 'Close' : 'Handoff') +
              '</button>' +
              '<button class="ghost-btn" data-action="toggle-details" data-id="' + escapeHtml(card.id) + '">' +
                (isDetailsOpen ? 'Hide' : 'History') +
              '</button>' +
              renderCardGearMenu(card) +
            '</div>' +
          '</div>' +
          searchHitsHtml
        );
      }

      function createCardShell(className, headerClassName, convId) {
        const el = document.createElement('div');
        el.className = className;
        el.setAttribute('data-conv-id', convId);
        el.innerHTML =
          '<div class="card-header-slot ' + headerClassName + '"></div>' +
          '<div class="card-handoff-slot card-slot" data-open="0"></div>' +
          '<div class="card-details-slot card-slot" data-rev="0"></div>';
        return el;
      }

      function syncCardDom(cardEl, card, headerHtml) {
        if (cardEl.classList.contains('conv-row')) {
          cardEl.classList.toggle('is-unread', Boolean(card.unread));
        }
        const headerSlot = cardEl.querySelector('.card-header-slot');
        if (headerSlot && headerSlot.innerHTML !== headerHtml) {
          headerSlot.innerHTML = headerHtml;
        }

        const handoffSlot = cardEl.querySelector('.card-handoff-slot');
        const isPending = Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);
        const hState = state.handoffStateByConv.get(card.id);
        const stepTag = hState && hState.step === 'ready' ? 'ready' : 'focus';
        const wantHandoff = isPending
          ? 'pending'
          : (state.openHandoffId === card.id ? stepTag : '0');
        if (handoffSlot && handoffSlot.getAttribute('data-open') !== wantHandoff) {
          handoffSlot.setAttribute('data-open', wantHandoff);
          handoffSlot.innerHTML = wantHandoff !== '0' ? renderHandoffDrawer(card) : '';
          if (wantHandoff !== '0') {
            const ta = handoffSlot.querySelector('textarea.handoff-input');
            if (ta && hState) {
              ta.value = hState.text;
            }
            restoreScrollPositions(handoffSlot);
          }
        } else if (handoffSlot && wantHandoff !== '0') {
          const modelBar = handoffSlot.querySelector('.handoff-model-bar');
          const nextSyncKey = getModelSyncKey(card);
          if (modelBar && modelBar.getAttribute('data-model-sync-key') !== nextSyncKey) {
            modelBar.setAttribute('data-model-sync-key', nextSyncKey);
            modelBar.innerHTML = renderHandoffModelBarInner(card);
          }
        }

        const detailsSlot = cardEl.querySelector('.card-details-slot');
        const details = state.expandedDetails.get(card.id);
        const wantRev = details ? String(details._rev || 1) : '0';
        if (detailsSlot && detailsSlot.getAttribute('data-rev') !== wantRev) {
          detailsSlot.setAttribute('data-rev', wantRev);
          detailsSlot.innerHTML = details ? renderDetailsDrawer(card) : '';
          if (details && !details.loading) {
            restoreScrollPositions(detailsSlot);
          }
        }
      }

      function resolveNewChatTargetWorkspace(effectiveScope, pinnedCard) {
        if (effectiveScope && effectiveScope !== '__all__' && effectiveScope !== '__unscoped__') {
          const ws = state.workspaces.find((w) => w.key === effectiveScope);
          if (ws) return ws;
        }
        if (state.activeWorkspaceKey && state.activeWorkspaceKey !== '__unscoped__') {
          const ws = state.workspaces.find((w) => w.key === state.activeWorkspaceKey);
          if (ws) return ws;
        }
        if (pinnedCard && (pinnedCard.projectId || pinnedCard.workspacePath)) {
          return {
            key: pinnedCard.workspaceKey || '',
            projectId: pinnedCard.projectId || '',
            path: pinnedCard.workspacePath || '',
            name: pinnedCard.workspaceName || 'Current Project'
          };
        }
        const firstProjWs = state.workspaces.find((w) => w.key !== '__unscoped__' && (w.projectId || w.path));
        return firstProjWs || null;
      }

      function renderNewChatDrawer(effectiveScope, pinnedCard) {
        if (!newChatSlotEl) return;
        if (btnToggleNewChatEl) {
          btnToggleNewChatEl.classList.toggle('active', Boolean(state.newChatOpen));
        }
        if (!state.newChatOpen) {
          if (newChatSlotEl.innerHTML !== '') {
            newChatSlotEl.innerHTML = '';
          }
          return;
        }

        const targetWs = resolveNewChatTargetWorkspace(effectiveScope, pinnedCard);
        const hasProjectTarget = Boolean(targetWs && (targetWs.projectId || targetWs.path));
        const isGeneral = !hasProjectTarget || Boolean(state.newChatGeneral);

        const scopeKey = [
          hasProjectTarget ? (targetWs.key || targetWs.name) : 'none',
          isGeneral ? 'general' : 'project',
          state.newChatSending ? 'sending' : 'idle'
        ].join('|');

        const existingDrawer = newChatSlotEl.querySelector('.new-chat-drawer');
        if (existingDrawer && existingDrawer.getAttribute('data-scope-key') === scopeKey) {
          return;
        }

        const activeTa = existingDrawer ? existingDrawer.querySelector('.new-chat-textarea') : null;
        if (activeTa) {
          state.newChatText = activeTa.value;
        }

        let chipsHtml = '';
        if (hasProjectTarget) {
          chipsHtml +=
            '<button class="scope-chip ' + (!isGeneral ? 'active' : '') + '" data-action="set-new-chat-scope" data-general="0" title="' + escapeHtml(targetWs.path || targetWs.name) + '">' +
              'Project: ' + escapeHtml(targetWs.name) +
            '</button>';
        }
        chipsHtml +=
          '<button class="scope-chip ' + (isGeneral ? 'active' : '') + '" data-action="set-new-chat-scope" data-general="1" title="Start a general conversation outside any project">' +
            'General (No Project)' +
          '</button>';

        newChatSlotEl.innerHTML =
          '<div class="new-chat-drawer" data-scope-key="' + escapeHtml(scopeKey) + '">' +
            '<div class="new-chat-scope-row">' +
              '<div class="new-chat-scope-chips">' + chipsHtml + '</div>' +
            '</div>' +
            '<textarea class="new-chat-textarea" id="new-chat-textarea" placeholder="Write a prompt to start a new conversation... (Ctrl+Enter to send)"' + (state.newChatSending ? ' readonly' : '') + '>' +
              escapeHtml(state.newChatText) +
            '</textarea>' +
            '<div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;">' +
              '<button class="ghost-btn" data-action="toggle-new-chat"' + (state.newChatSending ? ' disabled' : '') + '>Cancel</button>' +
              '<button class="btn-solid" data-action="submit-new-chat"' + (state.newChatSending ? ' disabled' : '') + '>' +
                (state.newChatSending ? 'Starting...' : 'Start Chat') +
              '</button>' +
            '</div>' +
          '</div>';

        const nextTa = newChatSlotEl.querySelector('.new-chat-textarea');
        if (nextTa) {
          nextTa.value = state.newChatText;
        }
      }

      function renderWorkspacePills(effectiveScope, pinnedId) {
        const allMain = state.conversations.filter((c) => !c.isSubagent);
        const otherMain = allMain.filter((c) => c.id !== pinnedId);
        const countsByWs = new Map();
        const unreadByWs = new Map();
        const thinkingByWs = new Map();
        for (const c of allMain) {
          const k = c.workspaceKey || '__unscoped__';
          if (c.isThinking) thinkingByWs.set(k, true);
          if (c.id !== pinnedId) {
            countsByWs.set(k, (countsByWs.get(k) || 0) + 1);
            if (c.unread) unreadByWs.set(k, true);
          }
        }

        let html = '';
        for (const ws of state.workspaces) {
          const otherCount = countsByWs.get(ws.key) || 0;
          const hasUnread = Boolean(unreadByWs.get(ws.key));
          const hasThinking = Boolean(thinkingByWs.get(ws.key));
          if (otherCount === 0 && !hasThinking && !hasUnread && effectiveScope !== ws.key) continue;
          const isActive = effectiveScope === ws.key;
          const projAttrs = ws.projectId
            ? ' data-project-id="' + escapeHtml(ws.projectId) + '" data-project-name="' + escapeHtml(ws.name) + '"'
            : '';
          const tip = ws.projectId
            ? (ws.path ? ws.path + ' · Right-click to archive project' : 'Right-click to archive project')
            : (ws.path || '');
          let indicatorHtml = '';
          if (hasThinking) {
            indicatorHtml += '<span class="thinking-dots" title="Agent is thinking in this project"><span></span><span></span><span></span></span>';
          }
          if (hasUnread) {
            indicatorHtml += '<span class="unread-dot" title="Unread reply in this project"></span>';
          }
          html +=
            '<button class="scope-tab ' + (isActive ? 'active' : '') + '" data-ws="' + escapeHtml(ws.key) + '"' + projAttrs + ' title="' + escapeHtml(tip) + '">' +
              indicatorHtml +
              '<span>' + escapeHtml(ws.name) + ' (' + otherCount + ')</span>' +
            '</button>';
        }

        html +=
          '<button class="scope-tab ' + (effectiveScope === '__all__' ? 'active' : '') + '" data-ws="__all__">' +
            '<span>All (' + otherMain.length + ')</span>' +
          '</button>';

        const archivedProjCount = Array.isArray(state.archivedProjects) ? state.archivedProjects.length : 0;
        const archivedConvCount = Array.isArray(state.archivedConversations) ? state.archivedConversations.length : 0;
        const totalArchivedCount = archivedProjCount + archivedConvCount;
        if (totalArchivedCount > 0) {
          html +=
            '<button class="scope-tab scope-tab-archived" data-action="open-archived-modal" title="View and restore archived conversations and projects">' +
              'Archived (' + totalArchivedCount + ')' +
            '</button>';
        }

        if (workspacePillsEl.innerHTML !== html) {
          workspacePillsEl.innerHTML = html;
        }
      }

      function getCardFocusMs(card) {
        if (!card) return 0;
        return Math.max(Number(card.lastViewMs) || 0, Number(card.lastUserInputMs) || 0);
      }

      function pickMostRecentFocusCard(cards) {
        let best = null;
        let bestFocusMs = -1;
        let bestActiveMs = -1;
        for (const c of cards) {
          const focusMs = getCardFocusMs(c);
          const activeMs = Number(c.lastActiveMs) || 0;
          if (focusMs > bestFocusMs || (focusMs === bestFocusMs && activeMs > bestActiveMs)) {
            bestFocusMs = focusMs;
            bestActiveMs = activeMs;
            best = c;
          }
        }
        return best;
      }

      function renderAll() {
        const mainChats = state.conversations.filter((c) => !c.isSubagent);
        const wsFocusChats = state.activeWorkspaceKey
          ? mainChats.filter((c) => c.workspaceKey === state.activeWorkspaceKey)
          : [];

        if (initialHostConvId) {
          state.hostConvId = initialHostConvId;
        }

        const hostCard = state.hostConvId
          ? state.conversations.find((c) => c.id === state.hostConvId)
          : null;
        const candidatePool = state.activeWorkspaceKey
          ? wsFocusChats
          : (mainChats.length > 0 ? mainChats : state.conversations);
        const newestWsCard = pickMostRecentFocusCard(candidatePool);

        let pinnedCard = hostCard || newestWsCard;
        if (!initialHostConvId) {
          const isManuallyPinned = Boolean(hostCard && state.manualPinId && state.manualPinId === hostCard.id);
          const isPendingOnHost = Boolean(
            hostCard && state.pendingSmartHandoff && state.pendingSmartHandoff.convId === hostCard.id
          );
          const manualPinRecent = Boolean(
            state.manualPinId && (Date.now() - state.manualPinTs) < 15000
          );
          const hostDifferentWs =
            Boolean(state.activeWorkspaceKey) &&
            Boolean(hostCard) &&
            hostCard.workspaceKey !== state.activeWorkspaceKey;

          if (isPendingOnHost) {
            pinnedCard = hostCard;
          } else if (hostCard && hostDifferentWs && !isManuallyPinned) {
            pinnedCard = newestWsCard;
            state.hostConvId = newestWsCard ? newestWsCard.id : '';
          } else if (hostCard && newestWsCard && newestWsCard.id !== hostCard.id) {
            const newestTs = getCardFocusMs(newestWsCard);
            const hostTs = getCardFocusMs(hostCard);
            const newActivityAfterManualPin =
              !state.manualPinId || newestTs > state.manualPinTs;

            if (newestTs > hostTs && newActivityAfterManualPin) {
              pinnedCard = newestWsCard;
              state.hostConvId = newestWsCard.id;
              state.manualPinId = '';
            }
          } else if (!hostCard && newestWsCard && !manualPinRecent) {
            state.hostConvId = newestWsCard.id;
          }
        }

        const pinnedId = pinnedCard ? pinnedCard.id : '';
        if (state.lastPinnedId && pinnedId && state.lastPinnedId !== pinnedId) {
          state.selectedWorkspaceKey = '__auto__';
          const isOldPending = Boolean(
            state.pendingSmartHandoff && state.pendingSmartHandoff.convId === state.lastPinnedId
          );
          if (state.openHandoffId === state.lastPinnedId && !isOldPending) {
            state.openHandoffId = null;
          }
        }
        state.lastPinnedId = pinnedId;

        if (pinnedCard) {
          let activeCardEl = pinnedContainer.querySelector('.active-card');
          if (!activeCardEl || activeCardEl.getAttribute('data-conv-id') !== pinnedCard.id) {
            pinnedContainer.innerHTML = '';
            activeCardEl = createCardShell('active-card', 'active-card-header', pinnedCard.id);
            pinnedContainer.appendChild(activeCardEl);
          }
          syncCardDom(activeCardEl, pinnedCard, renderActiveCardHeader(pinnedCard));
          activeWsIndicator.textContent = pinnedCard.workspaceName ? '· ' + pinnedCard.workspaceName : '';
        } else {
          statusDotEl.className = 'dot dot-fresh';
          const emptyPinnedMsg = state.activeWorkspaceKey
            ? 'No active conversation in this workspace yet.'
            : 'No active conversation detected yet.';
          const emptyPinnedHtml = '<div class="empty-box">' + emptyPinnedMsg + '</div>';
          if (pinnedContainer.innerHTML !== emptyPinnedHtml) {
            pinnedContainer.innerHTML = emptyPinnedHtml;
          }
          activeWsIndicator.textContent = '';
        }

        const effectiveScope = resolveEffectiveWorkspaceScope(pinnedCard);
        renderNewChatDrawer(effectiveScope, pinnedCard);
        renderWorkspacePills(effectiveScope, pinnedId);
        renderDiagnosticsSticky();

        const q = state.searchQuery.trim().toLowerCase();
        const filtered = state.conversations.filter((c) => {
          if (c.isSubagent) return false;
          if (c.id === pinnedId) return false;
          if (effectiveScope !== '__all__') {
            const cKey = c.workspaceKey || '__unscoped__';
            if (cKey !== effectiveScope) return false;
          }
          if (q) {
            if (!state.searchMatches || !state.searchMatches[c.id]) return false;
          }
          return true;
        });

        const wsObj = state.workspaces.find((w) => w.key === effectiveScope);
        const scopeTitle = effectiveScope === '__all__'
          ? 'Other conversations (All)'
          : 'Other conversations in ' + ((wsObj && wsObj.name) || 'workspace');
        listHeaderTitle.textContent = scopeTitle;
        listHeaderCount.textContent = filtered.length + ' chat' + (filtered.length === 1 ? '' : 's');

        if (sectionOtherEl && sectionOtherEl.classList.contains('collapsed')) {
          return;
        }

        const showWsName = effectiveScope === '__all__';
        if (filtered.length === 0) {
          const emptyMsg = effectiveScope !== '__all__'
            ? 'No other conversations in this workspace. Select "All" to browse other projects.'
            : 'No other conversations match the current filter.';
          const emptyHtml = '<div class="empty-box">' + emptyMsg + '</div>';
          if (cardsContainer.innerHTML !== emptyHtml) {
            cardsContainer.innerHTML = emptyHtml;
          }
        } else {
          const emptyBox = cardsContainer.querySelector(':scope > .empty-box');
          if (emptyBox) emptyBox.remove();

          const existingById = new Map();
          for (const child of Array.from(cardsContainer.children)) {
            const cid = child.getAttribute && child.getAttribute('data-conv-id');
            if (cid) {
              existingById.set(cid, child);
            } else {
              child.remove();
            }
          }

          const wantedIds = new Set(filtered.map((c) => c.id));
          for (const [cid, el] of existingById.entries()) {
            if (!wantedIds.has(cid)) {
              el.remove();
              existingById.delete(cid);
            }
          }

          const anyRowHasOpenDrawer = filtered.some(
            (c) =>
              state.openHandoffId === c.id ||
              Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === c.id) ||
              state.expandedDetails.has(c.id) ||
              state.openMenuConvId === c.id
          );

          for (let i = 0; i < filtered.length; i++) {
            const c = filtered[i];
            let rowEl = existingById.get(c.id);
            if (!rowEl) {
              rowEl = createCardShell('conv-row', 'conv-row-header', c.id);
              existingById.set(c.id, rowEl);
              cardsContainer.appendChild(rowEl);
            }
            if (!anyRowHasOpenDrawer && cardsContainer.children[i] !== rowEl) {
              cardsContainer.insertBefore(rowEl, cardsContainer.children[i] || null);
            }
            syncCardDom(rowEl, c, renderCompactRowHeader(c, showWsName));
          }
        }
      }

      function renderDiagnosticsSticky() {
        if (!diagStickyEl) return;
        const diag = state.diagnostics;
        const issues = diag && Array.isArray(diag.issues) ? diag.issues : [];
        const sig = (diag && diag.signature) || 'ok';
        const hasIssues = Boolean(diag && diag.status !== 'ok' && issues.length > 0 && sig !== state.dismissedDiagSig);

        if (!hasIssues) {
          if (diagStickyEl.style.display !== 'none') {
            diagStickyEl.style.display = 'none';
            diagStickyEl.innerHTML = '';
            diagStickyEl.removeAttribute('data-render-key');
          }
          if (appShellEl) appShellEl.classList.remove('has-diag-bar');
          return;
        }

        const isFail = diag.status === 'fail' || (diag.failCount || 0) > 0;
        const renderKey = [
          sig,
          state.diagExpanded ? 'open' : 'closed',
          state.diagRechecking ? 'rechecking' : 'idle'
        ].join('|');

        if (diagStickyEl.style.display === 'none') {
          diagStickyEl.style.display = 'flex';
        }
