<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Context Health</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --background: #101010;
      --foreground: #ededed;
      --card: #1c1c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #10b981;
    }

    .dot-sm {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--foreground, #ededed);
    }

    .brand-ws {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ghost-btn {
      background: transparent;
      color: var(--muted-foreground, #888888);
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 12.5px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }

    .ghost-btn:hover {
      color: var(--foreground, #ededed);
      border-color: var(--border, rgba(255, 255, 255, 0.09));
      background: var(--secondary, rgba(255, 255, 255, 0.04));
    }

    .active-card {
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .active-card-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-slot:empty {
      display: none;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .tier-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13.5px;
    }

    .tier-fresh { color: #34d399; }
    .tier-warm { color: #facc15; }
    .tier-heavy { color: #fb923c; }
    .tier-polluted { color: #f87171; }

    .dot-fresh { background: #10b981; }
    .dot-warm { background: #eab308; }
    .dot-heavy { background: #f97316; }
    .dot-polluted { background: #ef4444; }

    .muted {
      color: var(--muted-foreground, #888888);
      font-size: 12.5px;
      font-weight: 400;
    }

    .drift-warn {
      color: #fb923c;
      font-size: 12.5px;
      font-weight: 400;
    }

    .meter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 400;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground, #ededed);
    }

    .meter-track {
      width: 100%;
      height: 6px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 999px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .meter-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      flex-wrap: wrap;
    }

    .tokens-summary {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 7px;
      margin-top: 2px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.06));
    }

    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 9px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      flex-wrap: wrap;
    }

    .actions-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-solid {
      background: var(--foreground, #ededed);
      color: var(--background, #0a0a0a);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s;
    }

    .btn-solid:hover {
      opacity: 0.88;
    }

    .btn-outline {
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-outline:hover {
      background: var(--secondary, rgba(255, 255, 255, 0.06));
      border-color: rgba(255, 255, 255, 0.2);
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.14));
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 2px;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
      transition: opacity 0.12s;
    }

    .section-header:hover {
      opacity: 0.9;
    }

    .section-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .section-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 12px;
      color: var(--muted-foreground, #9a9a9a);
      transition: transform 0.15s ease, color 0.12s;
      flex-shrink: 0;
    }

    .section-header:hover .section-chevron {
      color: var(--foreground, #ededed);
    }

    .section-block.collapsed .section-chevron {
      transform: rotate(-90deg);
    }

    .section-block.collapsed .section-body {
      display: none;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--foreground, #ededed);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground, #a0a0a0);
      background: var(--secondary, rgba(255, 255, 255, 0.06));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 999px;
      padding: 1px 8px;
      flex-shrink: 0;
    }

    .section-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-card {
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 8px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .search-input {
      width: 100%;
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.12s;
    }

    .search-input::placeholder {
      color: var(--muted-foreground, #777777);
    }

    .search-input:focus {
      border-color: var(--muted-foreground, #888888);
    }

    .scope-tabs {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      max-height: 86px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
    }

    .scope-tabs::-webkit-scrollbar {
      width: 4px;
    }

    .scope-tabs::-webkit-scrollbar-track {
      background: transparent;
    }

    .scope-tabs::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }

    .scope-tabs::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .scope-tab {
      background: transparent;
      color: var(--muted-foreground, #888888);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 12.5px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.12s, background 0.12s, border-color 0.12s;
    }

    .scope-tab:hover {
      color: var(--foreground, #ededed);
    }

    .scope-tab.active {
      background: var(--secondary, rgba(255, 255, 255, 0.08));
      color: var(--foreground, #ededed);
      border-color: var(--border, rgba(255, 255, 255, 0.14));
      font-weight: 500;
    }

    .scope-tab-archived {
      border: 1px dashed var(--border, rgba(255, 255, 255, 0.14));
      color: var(--muted-foreground, #777777);
      font-size: 12px;
    }

    .scope-tab-archived:hover {
      border-color: var(--muted-foreground, #999999);
      color: var(--foreground, #ededed);
    }

    .conv-row {
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 8px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: border-color 0.12s;
    }

    .conv-row-header {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .conv-row:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .conv-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    .conv-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--foreground, #ededed);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
    }

    .conv-last-msg {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      margin-top: -3px;
    }

    .conv-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .conv-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
    }

    .conv-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .drawer {
      padding-top: 9px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .handoff-input {
      width: 100%;
      min-height: 120px;
      max-height: 420px;
      resize: vertical;
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
      border-radius: 6px;
      padding: 9px 11px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: hidden;
      overflow-y: auto;
      transition: border-color 0.12s, opacity 0.12s;
    }

    .handoff-input:focus {
      border-color: var(--muted-foreground, #888888);
    }

    .handoff-input[readonly] {
      opacity: 0.65;
      cursor: default;
    }

    .handoff-model-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .handoff-model-group {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .handoff-model-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground, #888888);
      white-space: nowrap;
    }

    .handoff-select {
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.14));
      border-radius: 5px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 12.5px;
      line-height: 1.3;
      outline: none;
      cursor: pointer;
      max-width: 220px;
      transition: border-color 0.12s;
    }

    .handoff-select:hover,
    .handoff-select:focus {
      border-color: var(--muted-foreground, #888888);
    }

    .handoff-select option {
      background: var(--card, #141414);
      color: var(--foreground, #ededed);
    }

    .drawer-subtitle {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted-foreground, #888888);
    }

    .commits-list, .prompts-scroll {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .commit-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 12.5px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.06));
      border-radius: 5px;
      padding: 5px 8px;
    }

    .commit-sha {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #facc15;
      flex-shrink: 0;
    }

    .commit-subj {
      color: var(--foreground, #ededed);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prompt-item {
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.06));
      border-radius: 6px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prompt-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
    }

    .prompt-item-text {
      font-size: 13px;
      color: var(--foreground, #ededed);
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .prompt-item-text.expanded {
      display: block;
      -webkit-line-clamp: unset;
      max-height: 260px;
      overflow-y: auto;
    }

    .expand-link {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--muted-foreground, #888888);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .expand-link:hover {
      color: var(--foreground, #ededed);
    }

    .search-hits {
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .empty-box {
      padding: 16px 12px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.06));
      border-radius: 8px;
    }

    .toast {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: var(--foreground, #ededed);
      color: var(--background, #0a0a0a);
      font-weight: 500;
      font-size: 13px;
      padding: 6px 11px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.15s, transform 0.15s;
      z-index: 9999;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9500;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 340px;
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.14));
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground, #ededed);
    }

    .modal-body {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--muted-foreground, #999999);
    }

    .modal-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }

    .modal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 6px;
    }

    .modal-row-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .modal-row-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground, #ededed);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-row-sub {
      font-size: 11.5px;
      color: var(--muted-foreground, #777777);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top-section">
      <div class="topbar">
        <div class="brand">
          <span class="dot" id="status-dot"></span>
          <span class="brand-title">Context Health</span>
          <span class="brand-ws" id="active-workspace-indicator"></span>
        </div>
        <button class="ghost-btn" id="btn-refresh" title="Refresh">Refresh</button>
      </div>

      <div id="pinned-container"></div>
    </div>

    <div class="section-block" id="section-other">
      <div class="section-header" data-action="toggle-section" data-section="other">
        <div class="section-header-left">
          <span class="section-chevron">▾</span>
          <span class="section-title" id="list-header-title">Other conversations</span>
        </div>
        <span class="section-badge" id="list-header-count"></span>
      </div>
      <div class="section-body">
        <div class="filter-card">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Filter conversations or prompts..."
          />
          <div class="scope-tabs" id="workspace-pills"></div>
        </div>
        <div id="cards-container" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      const initialHostConvId = (
        (window.sidecar && window.sidecar.conversationId) ||
        new URLSearchParams(window.location.search).get('conversationId') ||
        (window.__SIDECAR_BOOT__ && window.__SIDECAR_BOOT__.conversationId) ||
        ''
      ).trim().toLowerCase();

      try {
        const cachedTheme = sessionStorage.getItem('__ch_theme_vars__');
        if (cachedTheme) {
          const parsedVars = JSON.parse(cachedTheme);

          }
        }

      window.addEventListener('message', (ev) => {
        if (ev.data && ev.data.type === 'theme-change' && ev.data.payload && ev.data.payload.cssVariables) {

        }

        manualPinId: '',

        searchMatches: null,

      function showToast(msg) {
        toastEl.textContent = msg;

        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          toastEl.classList.remove('visible');
        }, 2000);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatRelativeTime(isoOrMs) {
        if (!isoOrMs) return '';
        const ms = typeof isoOrMs === 'number' ? isoOrMs : Date.parse(isoOrMs);
        if (!Number.isFinite(ms) || ms <= 0) return '';
        const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
        if (diffSec < 45) return 'just now';
        const mins = Math.floor(diffSec / 60);
        if (mins < 60) return mins + 'm ago';
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h ago';
        const days = Math.floor(hours / 24);
        if (days < 30) return days + 'd ago';
        return Math.floor(days / 30) + 'mo ago';
      }

      function formatTokens(tok) {
        if (!tok || tok <= 0) return '0';
        if (tok >= 1000000) return (tok / 1000000).toFixed(2) + 'M';
        if (tok >= 1000) return (tok / 1000).toFixed(1) + 'k';
        return String(tok);
      }

      async function copyTextToClipboard(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch {}
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch {}
        document.body.removeChild(ta);
        return ok;
      }

      function apiFetch(urlPath, options = {}) {
        if (window.sidecar && typeof window.sidecar.fetch === 'function') {
          return window.sidecar.fetch(urlPath, options);
        }
        return fetch(urlPath, options);
      }

      function openConversationInHost(convId) {
        if (window.sidecar && window.sidecar.ui && typeof window.sidecar.ui.toggleConversation === 'function') {
          window.sidecar.ui.toggleConversation(convId);
        }
      }

      function resolveEffectiveWorkspaceScope(activeCard) {
        if (state.selectedWorkspaceKey !== '__auto__') {
          return state.selectedWorkspaceKey;
        }
        if (state.activeWorkspaceKey) {
          return state.activeWorkspaceKey;

        if (activeCard && activeCard.workspaceKey) {
          return activeCard.workspaceKey;
        }
        return '__all__';
      }

      const TIER_UI = {
        fresh: { id: 'fresh', label: 'Fresh', text: 'tier-fresh', dot: 'dot-fresh', color: '#10b981' },
        warm: { id: 'warm', label: 'Warm', text: 'tier-warm', dot: 'dot-warm', color: '#eab308' },
        heavy: { id: 'heavy', label: 'Heavy', text: 'tier-heavy', dot: 'dot-heavy', color: '#f97316' },
        polluted: { id: 'polluted', label: 'Polluted', text: 'tier-polluted', dot: 'dot-polluted', color: '#ef4444' }
      };

      function getCardTier(card) {
        const id = (card && card.pollution && card.pollution.id) || 'fresh';
        return TIER_UI[id] || TIER_UI.fresh;
      }

      document.addEventListener('scroll', (e) => {
        const el = e.target;
        if (el && el.getAttribute) {
          const key = el.getAttribute('data-scroll-key');
          if (key) {
            state.scrollPositions.set(key, el.scrollTop);
          }
        }
      }, true);

      function restoreScrollPositions(rootEl) {
        if (!rootEl || !rootEl.querySelectorAll) return;
        const scrollables = rootEl.querySelectorAll('[data-scroll-key]');
        for (const el of scrollables) {
          const key = el.getAttribute('data-scroll-key');
          if (key && state.scrollPositions.has(key)) {
            el.scrollTop = state.scrollPositions.get(key);
          }
        }
      }

      function renderDetailsDrawer(card) {
        const details = state.expandedDetails.get(card.id);
        if (!details) return '';
        if (details.loading) {
          return '<div class="drawer"><span class="muted">Loading history...</span></div>';
        }

        let html = '<div class="drawer">';

        if (Array.isArray(details.missedCommits) && details.missedCommits.length > 0) {
          html += '<div class="drawer-subtitle">Missed commits (' + details.commitsBehind + ' behind HEAD)</div>';
          html += '<div class="commits-list" data-scroll-key="' + escapeHtml(card.id + ':commits') + '">';
          for (const c of details.missedCommits) {
            html +=
              '<div class="commit-row">' +
                '<span class="commit-sha">' + escapeHtml(c.short) + '</span>' +
                '<span class="commit-subj">' + escapeHtml(c.subject) + '</span>' +
                '<span class="muted">' + escapeHtml(formatRelativeTime(c.tsMs || c.iso)) + '</span>' +
              '</div>';
          }
          html += '</div>';
        }

        if (details.checkpointOverview) {
          const ovKey = card.id + ':overview';
          const ovExpanded = state.expandedPromptKeys.has(ovKey);
          html +=
            '<div class="drawer-subtitle">Latest compact overview</div>' +
            '<div class="prompt-item">' +
              '<div class="prompt-item-text' + (ovExpanded ? ' expanded' : '') + '" data-scroll-key="' + escapeHtml(ovKey) + '">' +
                escapeHtml(details.checkpointOverview) +
              '</div>' +
              '<button class="expand-link" data-action="toggle-clamp" data-expand-key="' + escapeHtml(ovKey) + '">' +
                (ovExpanded ? 'Show less' : 'Show more') +
              '</button>' +
            '</div>';
        }

        const prompts = Array.isArray(details.prompts) ? details.prompts : [];
        html += '<div class="drawer-subtitle">User prompts (' + prompts.length + ')</div>';
        if (prompts.length === 0) {
          html += '<div class="muted">No user prompts recorded.</div>';
        } else {
          html += '<div class="prompts-scroll" data-scroll-key="' + escapeHtml(card.id + ':prompts') + '">';
          for (const p of prompts) {
            const needsExpand = (p.text || '').length > 160 || (p.text || '').split('\n').length > 3;
            const pKey = card.id + ':' + p.index;
            const pExpanded = state.expandedPromptKeys.has(pKey);
            html +=
              '<div class="prompt-item">' +
                '<div class="prompt-item-head">' +
                  '<span>#' + p.index + '</span>' +
                  '<span>' + escapeHtml(formatRelativeTime(p.createdAt)) + '</span>' +
                '</div>' +
                '<div class="prompt-item-text' + (pExpanded ? ' expanded' : '') + '" data-scroll-key="' + escapeHtml(pKey) + '">' + escapeHtml(p.text) + '</div>' +
                (needsExpand
                  ? '<button class="expand-link" data-action="toggle-clamp" data-expand-key="' + escapeHtml(pKey) + '">' +
                      (pExpanded ? 'Show less' : 'Show more') +
                    '</button>'
                  : '') +
              '</div>';
          }
          html += '</div>';
        }

        html += '</div>';
        return html;

      function getHandoffState(convId) {
        let st = state.handoffStateByConv.get(convId);
        if (!st) {
          st = {
            step: 'focus',
            text: '',
            selectedModelEnum: null
          };
          state.handoffStateByConv.set(convId, st);
        }
        return st;
      }

      function parseLabelFamilyAndTier(label) {
        const clean = (label || '').trim();
        const m = /^(.+?)\s*\(([^()]+)\)$/.exec(clean);
        if (m) {
          return { family: m[1].trim(), tier: m[2].trim() };
        }
        return { family: clean || 'Default Model', tier: '' };
      }

      function getEffectiveModelsForCard(card) {
        const list = Array.isArray(state.availableModels) ? state.availableModels.slice() : [];
        if (card && card.modelEnum) {
          const exists = list.some((m) => m.modelEnum === card.modelEnum);
          if (!exists) {
            const label = card.modelLabel || card.modelEnum;
            const parsed = parseLabelFamilyAndTier(label);
            list.unshift({
              modelEnum: card.modelEnum,
              modelId: '',
              label,
              family: parsed.family,
              tier: parsed.tier
            });
          }
        }
        return list;
      }

      function groupModelsByFamily(card) {
        const list = getEffectiveModelsForCard(card);
        const byFamily = new Map();
        const groups = [];
        for (const m of list) {
          const fam = m.family || m.label || m.modelEnum;
          let g = byFamily.get(fam);
          if (!g) {
            g = { family: fam, models: [] };
            byFamily.set(fam, g);
            groups.push(g);
          }
          g.models.push(m);
        }
        return groups;
      }

      function resolveSelectedModelEntry(card) {
        const hState = card ? getHandoffState(card.id) : null;
        const list = getEffectiveModelsForCard(card);
        const wantedEnum =
          (hState && hState.selectedModelEnum) ||
          (card && card.modelEnum) ||
          state.defaultModelEnum ||
          (list[0] && list[0].modelEnum) ||
          '';
        if (!wantedEnum) return null;
        const found = list.find((m) => m.modelEnum === wantedEnum);
        if (found) return found;
        return list[0] || null;
      }

      function getModelSyncKey(card) {
        if (!card) return '';
        const hState = state.handoffStateByConv.get(card.id);
        const sel = (hState && hState.selectedModelEnum) || '';
        const catKey = Array.isArray(state.availableModels)
          ? state.availableModels.map((m) => m.modelEnum).join(',')
          : '';
        return [catKey, state.defaultModelEnum || '', card.modelEnum || '', card.modelLabel || '', sel].join('|');
      }

      function renderHandoffModelBarInner(card) {
        const groups = groupModelsByFamily(card);
        const selected = resolveSelectedModelEntry(card);
        if (groups.length === 0 || !selected) {
          return '<span class="handoff-model-label">Model: detecting available models...</span>';
        }
        const idEsc = escapeHtml(card.id);
        const selectedGroup = groups.find((g) => g.family === selected.family) || groups[0];
        let familyOpts = '';
        for (const g of groups) {
          const isSel = g.family === selectedGroup.family ? ' selected' : '';
          familyOpts +=
            '<option value="' + escapeHtml(g.family) + '"' + isSel + '>' +
              escapeHtml(g.family) +
            '</option>';
        }

        let html =
          '<div class="handoff-model-group">' +
            '<span class="handoff-model-label">Model</span>' +
            '<select class="handoff-select handoff-family-select" data-conv-id="' + idEsc + '">' +
              familyOpts +
            '</select>' +
          '</div>';

        const hasTiers =
          selectedGroup.models.length > 1 ||
          Boolean(selectedGroup.models[0] && selectedGroup.models[0].tier);
        if (hasTiers) {
          let tierOpts = '';
          for (const m of selectedGroup.models) {
            const tierLabel = m.tier || 'Default';
            const isSel = m.modelEnum === selected.modelEnum ? ' selected' : '';
            tierOpts +=
              '<option value="' + escapeHtml(m.modelEnum) + '"' + isSel + '>' +

              '</option>';

              '<select class="handoff-select handoff-tier-select" data-conv-id="' + idEsc + '">' +
                tierOpts +
              '</select>' +
            '</div>';
        }
        return html;
      }

      function renderHandoffDrawer(card) {
        const isPending = Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);
        if (!isPending && state.openHandoffId !== card.id) return '';

        const hState = getHandoffState(card.id);
        const idEsc = escapeHtml(card.id);

        let rows = 6;

            '<button class="ghost-btn" data-action="cancel-pending-handoff" data-id="' + idEsc + '">' +

          subtitleHtml =
            '<div class="drawer-subtitle" style="color:#34d399;">' +

            modelBarHtml +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
              buttonsHtml +
            '</div>' +
          '</div>'
        );
